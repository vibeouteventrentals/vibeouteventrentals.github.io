            g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();}
          for(var i=0;i<800;i++){var x=Math.random()*S,y=Math.random()*S,r=2+Math.random()*4,sh=night?(35+Math.random()*50):(90+Math.random()*70);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh*0.98)+','+Math.floor(sh*0.93)+')'; g.globalAlpha=0.6;
            g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();}
        } else if(type==='concrete'){
          g.fillStyle=night?'#4a4a4a':'#9a9a9a'; g.fillRect(0,0,S,S);
          for(var i=0;i<8000;i++){var x=Math.random()*S,y=Math.random()*S,sh=night?(55+Math.random()*35):(130+Math.random()*50);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh)+')'; g.globalAlpha=0.3;
            g.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);}
        } else if(type==='sand'){
          g.fillStyle=night?'#6b5a3a':'#d4bc82'; g.fillRect(0,0,S,S);
          for(var i=0;i<10000;i++){var x=Math.random()*S,y=Math.random()*S,rv=Math.random();

        } else if(type==='dirt'){

            else g.fillStyle=rv<0.33?'#8b6b45':rv<0.66?'#6b4e30':'#9a7a50';
            g.globalAlpha=0.6; g.fillRect(x,y,w,h);}
        } else if(type==='asphalt'){
          g.fillStyle=night?'#1a1a1a':'#3e3e3e'; g.fillRect(0,0,S,S);
          for(var i=0;i<10000;i++){var x=Math.random()*S,y=Math.random()*S,sh=night?(15+Math.random()*30):(40+Math.random()*40);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh)+')'; g.globalAlpha=0.4;
            g.fillRect(x,y,1+Math.random()*1.5,1+Math.random()*1.5);}
        } else if(type==='parking_lot'){
          g.fillStyle=night?'#222222':'#4a4a4a'; g.fillRect(0,0,S,S);

    <script>
        const ITEM_DEFS = {&quot;chair-single&quot;:{&quot;type&quot;:&quot;rect&quot;,&quot;width&quot;:1.8,&quot;height&quot;:2,&quot;seats&quot;:1,&quot;color&quot;:&quot;#e5e7eb&quot;,&quot;displayName&quot;:&quot;Chair&quot;,&quot;description&quot;:&quot;Single chair (independent of table seating). Use for ceremony rows, classroom layouts, or free-form seating.&quot;},&quot;cocktail-table&quot;:{&quot;type&quot;:&quot;round&quot;,&quot;diameter&quot;:2.5,&quot;seats&quot;:4,&quot;color&quot;:&quot;#2F4F4F&quot;,&quot;displayName&quot;:&quot;Cocktail&quot;,&quot;description&quot;:&quot;High-top 'bistro' table. Seats 4 bar stools (adjustable 0–4). Encourages guest mingling and serves as a landing spot for drinks during receptions.&quot;},&quot;round-table-5ft&quot;:{&quot;type&quot;:&quot;round&quot;,&quot;diameter&quot;:5,&quot;seats&quot;:8,&quot;color&quot;:&quot;#556B2F&quot;,&quot;displayName&quot;:&quot;5 ft Round&quot;,&quot;description&quot;:&quot;Standard 60-inch circular table. Seats 8 guests comfortably. Best for weddings and gala dinners to facilitate face-to-face conversation.&quot;},&quot;head-table-8ft&quot;:{&quot;type&quot;:&quot;head&quot;,&quot;width&quot;:8,&quot;height&quot;:2.5,&quot;seats&quot;:4,&quot;color&quot;:&quot;#4B0082&quot;,&quot;displayName&quot;:&quot;8 ft Head&quot;,&quot;description&quot;:&quot;Large one-sided table. Seats 4 guests on the front face. Used to anchor the focus of the room for VIPs or wedding parties.&quot;},&quot;tent-item-20x20-marquee&quot;:{&quot;type&quot;:&quot;structure&quot;,&quot;width&quot;:20,&quot;height&quot;:20,&quot;seats&quot;:0,&quot;color&quot;:&quot;#ffffff&quot;,&quot;displayName&quot;:&quot;20x20 Marquee&quot;,&quot;tentType&quot;:&quot;Marquee&quot;,&quot;description&quot;:&quot;High-peak frame tent. Ideal for small parties or as an entrance foyer to a larger structure.&quot;},&quot;decor-wooden-classic-arch&quot;:{&quot;type&quot;:&quot;rect&quot;,&quot;width&quot;:7,&quot;height&quot;:1.5,&quot;seats&quot;:0,&quot;color&quot;:&quot;#8B5E3C&quot;,&quot;displayName&quot;:&quot;Wooden Classic Arch&quot;,&quot;description&quot;:&quot;Wooden ceremony arch (7 ft tall). Classic backdrop for ceremonies, photo ops, and entrances.&quot;},&quot;person-groom&quot;:{&quot;type&quot;:&quot;rect&quot;,&quot;width&quot;:2.5,&quot;height&quot;:2.5,&quot;seats&quot;:0,&quot;color&quot;:&quot;#f97316&quot;,&quot;displayName&quot;:&quot;Groom&quot;,&quot;description&quot;:&quot;3D groom (6 ft tall). Useful for ceremony mockups, entrances, and spacing visuals.&quot;},&quot;person-bride&quot;:{&quot;type&quot;:&quot;rect&quot;,&quot;width&quot;:2.5,&quot;height&quot;:2.5,&quot;seats&quot;:0,&quot;color&quot;:&quot;#fb7185&quot;,&quot;displayName&quot;:&quot;Bride&quot;,&quot;description&quot;:&quot;3D bride (5 ft 5 in). Useful for ceremony mockups, entrances, and spacing visuals.&quot;},&quot;string-lights&quot;:{&quot;type&quot;:&quot;stringlights&quot;,&quot;seats&quot;:0,&quot;color&quot;:&quot;#ffffff&quot;,&quot;displayName&quot;:&quot;String Lights&quot;,&quot;description&quot;:&quot;Bistro/café string lights. Drag endpoints to set length, then adjust mount height + hang.&quot;},&quot;drape-pipe-and-base&quot;:{&quot;type&quot;:&quot;drape&quot;,&quot;seats&quot;:0,&quot;color&quot;:&quot;#333&quot;,&quot;displayName&quot;:&quot;Pipe &amp; Drape&quot;,&quot;description&quot;:&quot;Modular fabric wall system. Used for room division, masking unsightly areas, or creating dramatic backdrops behind stages.&quot;}};
        // Top-down SVG icon registry (injected from topDownSvg.ts)
        (new Function(&quot;// -----------------------------------------------------------------------------\n// Top-Down SVG Registry - Realistic 2D plan-view icons for every inventory item\n// -----------------------------------------------------------------------------\n// Returns an SVG string (or empty string if no custom icon) for a given item.\n// The SVG fills its container via viewBox=\&quot;0 0 100 100\&quot; and preserveAspectRatio.\n// Colors are passed in so linens/overrides still work.\n\n\n\n// -- helpers ------------------------------------------------------------------\nlet _svgIdCounter = 0;\nconst uid = () => `td${++_svgIdCounter}`;\n\nconst esc = (c) => c.replace(/\&quot;/g, '&amp;quot;');\nconst darken = (hex, amt = 30) => {\n  let c = hex.replace('#', '');\n  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];\n  const n = parseInt(c, 16);\n  let r = (n >> 16) - amt; let g = ((n >> 8) &amp; 0xff) - amt; let b = (n &amp; 0xff) - amt;\n  r = Math.max(0, r); g = Math.max(0, g); b = Math.max(0, b);\n  return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;\n};\nconst lighten = (hex, amt = 40) => {\n  let c = hex.replace('#', '');\n  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];\n  const n = parseInt(c, 16);\n  let r = (n >> 16) + amt; let g = ((n >> 8) &amp; 0xff) + amt; let b = (n &amp; 0xff) + amt;\n  r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);\n  return `#${(r << 16 | g << 8 | b).toString(16).padStart(6, '0')}`;\n};\n\n// -- Luminance-based contrast text color -------------------------------------\n// Call this to determine whether text on a given background should be white or black.\nfunction getContrastTextColor(hex) {\n  let c = hex.replace('#', '');\n  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];\n  const n = parseInt(c, 16);\n  const r = (n >> 16) &amp; 0xff;\n  const g = (n >> 8) &amp; 0xff;\n  const b = n &amp; 0xff;\n  // Relative luminance (sRGB)\n  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;\n  return lum > 0.55 ? 'black' : 'white';\n}\n\nconst wrap = (inner, vw = 100, vh = 100) =>\n  `<svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 ${vw} ${vh}\&quot; preserveAspectRatio=\&quot;none\&quot; width=\&quot;100%\&quot; height=\&quot;100%\&quot; style=\&quot;position:absolute;inset:0;pointer-events:none\&quot;>${inner}</svg>`;\n\n// -- ROUND TABLES -------------------------------------------------------------\nconst roundTable = (color) => {\n  const d = darken(color, 20);\n  const l = lighten(color, 25);\n  const g = uid();\n  return wrap(`\n    <defs>\n      <radialGradient id=\&quot;${g}\&quot; cx=\&quot;45%\&quot; cy=\&quot;40%\&quot;>\n        <stop offset=\&quot;0%\&quot; stop-color=\&quot;${l}\&quot;/>\n        <stop offset=\&quot;60%\&quot; stop-color=\&quot;${esc(color)}\&quot;/>\n        <stop offset=\&quot;100%\&quot; stop-color=\&quot;${d}\&quot;/>\n      </radialGradient>\n    </defs>\n    <circle cx=\&quot;50\&quot; cy=\&quot;50\&quot; r=\&quot;48\&quot; fill=\&quot;url(#${g})\&quot; stroke=\&quot;${d}\&quot; stroke-width=\&quot;2.5\&quot;/>\n    <ellipse cx=\&quot;50\&quot; cy=\&quot;50\&quot; rx=\&quot;40\&quot; ry=\&quot;40\&quot; fill=\&quot;none\&quot; stroke=\&quot;${d}\&quot; stroke-width=\&quot;0.5\&quot; opacity=\&quot;0.25\&quot;/>\n    <ellipse cx=\&quot;50\&quot; cy=\&quot;50\&quot; rx=\&quot;28\&quot; ry=\&quot;28\&quot; fill=\&quot;none\&quot; stroke=\&quot;${d}\&quot; stroke-width=\&quot;0.3\&quot; opacity=\&quot;0.15\&quot;/>\n    <circle cx=\&quot;50\&quot; cy=\&quot;50\&quot; r=\&quot;5\&quot; fill=\&quot;${d}\&quot; opacity=\&quot;0.12\&quot;/>\n    <ellipse cx=\&quot;38\&quot; cy=\&quot;35\&quot; rx=\&quot;10\&quot; ry=\&quot;8\&quot; fill=\&quot;${l}\&quot; opacity=\&quot;0.15\&quot; transform=\&quot;rotate(-20 38 35)\&quot;/>\n  `);\n};\n\n// -- ROUND PLASTIC TABLE ------------------------------------------------------\nconst roundTablePlastic = (color) => {\n  const g = uid();\n         let historyStack = [];
        let redoStack = [];

        function pushHistory() {
            historyStack.push(JSON.stringify({ 
                items: STATE.items, 
                sidewalls: STATE.tent?.sidewalls || [] 
            }));
            if (historyStack.length > 50) historyStack.shift();
            redoStack = [];
        }

        function undo() {
            if (!historyStack.length) return;
            redoStack.push(JSON.stringify({ 
                items: STATE.items, 
                sidewalls: STATE.tent?.sidewalls || [] 
            }));
            const prev = JSON.parse(historyStack.pop());
            STATE.items = prev.items;
            if(STATE.tent) STATE.tent.sidewalls = prev.sidewalls;
            render2D();
        }

        function redo() {
            if (!redoStack.length) return;
            historyStack.push(JSON.stringify({ 
                items: STATE.items, 
                sidewalls: STATE.tent?.sidewalls || [] 
            }));
            const next = JSON.parse(redoStack.pop());
            STATE.items = next.items;
            if(STATE.tent) STATE.tent.sidewalls = next.sidewalls;
            render2D();
        }

        function showTip(key) {
          if (!STATE.tutorialActive || seenTips.has(key) || !TIPS[key]) return;
          const tipEl = document.getElementById('tutorial-tip');
          tipEl.innerText = TIPS[key];
          tipEl.classList.add('active');
          seenTips.add(key);
          setTimeout(() => tipEl.classList.remove('active'), 5000);
        }

        function toggleTutorial() {
          STATE.tutorialActive = !STATE.tutorialActive;
          const btn = document.getElementById('tutorial-mode-btn');
          btn.innerText = 'Help Mode: ' + (STATE.tutorialActive ? 'ON' : 'OFF');
          btn.classList.toggle('on', STATE.tutorialActive);
          if (!STATE.tutorialActive) document.getElementById('tutorial-tip').classList.remove('active');
        }

        function toggleTapeMeasure() {
            STATE.isTapeActive = !STATE.isTapeActive;
            const btn = document.getElementById('btn-tape-measure');
            btn.classList.toggle('active', STATE.isTapeActive);
            STATE.tapePoints = { start: null, end: null };
            if (STATE.isTapeActive) {
                STATE.selectedIds = [];
                showTip('tape');
            }
            render2D();
        }

        function hasTentLightingItems() {
            return STATE.items.some(function(i) { return !!i.tentLightingFor; });
        }

        function updateTentLightingBtn() {
            var btn = document.getElementById('btn-tent-lighting');
            if (!btn) return;
            btn.style.display = hasTentLightingItems() ? 'flex' : 'none';
            btn.classList.toggle('active', STATE.showTentLighting);
        }

        function toggleTentLighting() {
            STATE.showTentLighting = !STATE.showTentLighting;
            updateTentLightingBtn();
            render2D();
        }

        function toggleNightMode() {
            if (MODE !== 'outside') return;
            STATE.isNightMode = !STATE.isNightMode;
            updateNightModeUI();
            if (STATE.view === '3d') {
                init3D(true);
            } else {
                render2D();
            }
        }

        function updateNightModeUI() {
            const ico = STATE.isNightMode ? ICO.sun : ICO.moon;
            const btn = document.getElementById('footer-night-btn');
            if (btn) btn.innerHTML = ico;
            const overlayBtn = document.getElementById('overlay-night-btn');
            if (overlayBtn) {
                overlayBtn.innerHTML = ico;
                overlayBtn.style.display = (MODE === 'outside') ? 'flex' : 'none';
            }
        }

            if (MODE === 'outside') {
                // Toggle between clear (transparent) and opaque roof — roof always stays visible
                STATE.clearTop = !STATE.clearTop;
            } else {
                STATE.showRoof = !STATE.showRoof;
            }
            updateRoofWallsBtnUI();
            if (STATE.view === '3d') { init3D(true); }
        }
        function toggleEmbedWalls() {
            STATE.showWalls = !STATE.showWalls;
            // Sync tent walls visibility for both modes
            STATE.tentWallsVisible = STATE.showWalls;
            updateRoofWallsBtnUI();
            if (STATE.view === '3d') { init3D(true); }
        }
        function updateRoofWallsBtnUI() {
            var rb = document.getElementById('footer-roof-btn');
            var wb = document.getElementById('footer-walls-btn');
            if (rb) {
                if (MODE === 'outside') {
                    // Outside: ROOF ON = opaque (clearTop false), ROOF OFF = clear (clearTop true)
                    rb.textContent = STATE.clearTop ? 'ROOF OFF' : 'ROOF ON';
                    if (STATE.clearTop) { rb.classList.remove('embed-3d-btn-white'); rb.classList.add('embed-3d-btn-blue'); }
                    else { rb.classList.remove('embed-3d-btn-blue'); rb.classList.add('embed-3d-btn-white'); }
                } else {
                    rb.textContent = STATE.showRoof ? 'ROOF ON' : 'ROOF OFF';
                    if (!STATE.showRoof) { rb.classList.remove('embed-3d-btn-white'); rb.classList.add('embed-3d-btn-blue'); }
                    else { rb.classList.remove('embed-3d-btn-blue'); rb.classList.add('embed-3d-btn-white'); }
                }
            }
            if (wb) {
                wb.textContent = STATE.showWalls ? 'WALLS ON' : 'WALLS OFF';
                if (!STATE.showWalls) { wb.classList.remove('embed-3d-btn-white'); wb.classList.add('embed-3d-btn-blue'); }
                else { wb.classList.remove('embed-3d-btn-blue'); wb.classList.add('embed-3d-btn-white'); }
            }
        }

        // ── Multi-Layout tab switching ──
        function initMultiLayoutTabs() {
            if (!MULTI_LAYOUTS || MULTI_LAYOUTS.length === 0) return;
            var bar = document.getElementById('ml-tab-bar');
            if (!bar) return;
            bar.classList.add('active');
            // First tab = current layout (always included)
            var defaultTab = document.createElement('button');
            defaultTab.className = 'ml-tab active';
            defaultTab.textContent = 'Default';
            defaultTab.setAttribute('data-ml-idx', '0');
            defaultTab.onclick = function() { switchMultiLayout(0); };
            bar.appendChild(defaultTab);
            // Additional tabs from uploaded .tm files
            for (var i = 0; i < MULTI_LAYOUTS.length; i++) {
                var tab = document.createElement('button');
                tab.className = 'ml-tab';
                tab.textContent = MULTI_LAYOUTS[i].label || ('Layout ' + (i + 1));
                tab.setAttribute('data-ml-idx', String(i + 1));
                tab.onclick = (function(idx) { return function() { switchMultiLayout(idx); }; })(i + 1);
                bar.appendChild(tab);
            }
            // Set CSS variable for multi-layout offset — all fixed UI elements use this
            function updateMlOffset() {
                var h = bar.offsetHeight || 40;
                document.body.style.setProperty('--ml-offset', h + 'px');
                var tutBtn = document.getElementById('tutorial-mode-btn');
                if (tutBtn) tutBtn.style.top = (h + 14) + 'px';
                var brandLogo = document.getElementById('embed-brand-logo');
                if (brandLogo) brandLogo.style.top = (h + 10) + 'px';
                try { window.parent.postMessage({ type: 'tm-extend-iframe', extraHeight: h }, '*'); } catch(e) {}
            }
            updateMlOffset();
            // Keep offset in sync when bar resizes (orientation change, dynamic tabs)
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function() { updateMlOffset(); }).observe(bar);
            }
            window.addEventListener('resize', updateMlOffset);
        }

        function addItemFromPicker(itemKey) {
            try {
                const rawKey = String(itemKey || '').trim();
                if (!rawKey) return;

                let key = rawKey;
                let def = ITEM_DEFS[key];

                // Chair-model pseudo key support: &quot;chair3d:<style>&quot; adds a chair-single with a fixed chairStyle.
                let chairStyleOverride = null;
                let chiavariCushionOverride = null;
                if (isChairAddonKey(rawKey)) {
                    const style = chairStyleFromAddonKey(rawKey);
                    key = 'chair-single';
                    def = ITEM_DEFS[key];
                    chairStyleOverride = style;

                    // If this is a Chiavari chair, respect the global chiavari cushion toggle unless the style explicitly includes cushion.
                    if (String(style || '').startsWith('chiavari_')) {
                        chiavariCushionOverride = (style === 'chiavari_white_cushion') ? true : STATE.chiavariCushion;
                    }
                }

                if (!def) return;

                const dims = getSpaceDims();
                const w = dims.w;
                const d = dims.h;

                const iw = (def.width || def.diameter || 1);
                const ih = (def.height || def.diameter || 1);

                let fx = w / 2;
                let fz = d / 2;

                // Prefer the currently selected item as an anchor so additions feel local in 2D.
                const selectedItem = Array.isArray(STATE.selectedIds)
                    ? STATE.items.find(function(item) { return STATE.selectedIds.indexOf(item.id) !== -1; })
                    : null;
                if (selectedItem) {
                    const selectedDef = ITEM_DEFS[selectedItem.name] || {};
                    const selectedW = Number(selectedItem.width || selectedDef.width || selectedDef.diameter || 1) || 1;
                    fx = (((Number(selectedItem.x) || 0) / CELL_SIZE) - borderCells) + (selectedW / 2);
                    fz = (((Number(selectedItem.y) || 0) / CELL_SIZE) - borderCells) + ((Number(selectedItem.height || selectedDef.height || selectedDef.diameter || 1) || 1) / 2);
                }

                // In 3D, spawn near where the camera is looking.
                if (STATE.view === '3d' &amp;&amp; typeof THREE !== 'undefined' &amp;&amp; camera &amp;&amp; camera.position) {
                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);

                    const denom = dir.y;
                    if (Math.abs(denom) > 0.0001) {
                        const t = (0 - camera.position.y) / denom;
                        if (isFinite(t) &amp;&amp; t > 0) {
                            fx = camera.position.x + dir.x * t;
                            fz = camera.position.z + dir.z * t;
                        } else {
                            const dist = 18;
                            fx = camera.position.x + dir.x * dist;
                            fz = camera.position.z + dir.z * dist;
                        }
                    } else {
                        const dist = 18;
                        fx = camera.position.x + dir.x * dist;
                        fz = camera.position.z + dir.z * dist;
                    }
                }

                // Keep within bounds (with half-size margin)
                fx = clamp(fx, 0 + (iw / 2), w - (iw / 2));
                fz = clamp(fz, 0 + (ih / 2), d - (ih / 2));

                const newItem = {
                    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    name: key,
                    x: Math.round((fx + borderCells - (iw / 2)) * CELL_SIZE),
                    y: Math.round((fz + borderCells - (ih / 2)) * CELL_SIZE),
                    width: iw,
                    height: ih,
                    seats: def.seats || 0,
                    color: def.color || '#94a3b8',
                    angle: 0,
                    chairStyle: chairStyleOverride || STATE.chairStyle,
                    chairTableSpacing: STATE.chairTableSpacing,
                    chiavariCushion: (typeof chiavariCushionOverride === 'boolean') ? chiavariCushionOverride : STATE.chiavariCushion
                };

                if (def.type === 'drape' &amp;&amp; !newItem.drapePoints) {
                    newItem.drapePoints = [{ x: 0, y: 0 }, { x: 10 * CELL_SIZE, y: 0 }];
                }
                if (def.type === 'stringlights') {
                    if (!newItem.stringLightPoints) newItem.stringLightPoints = [{ x: 0, y: 0 }, { x: 10 * CELL_SIZE, y: 0 }];
                    if (newItem.stringLightHeightFt === undefined) newItem.stringLightHeightFt = 8;
                    if (newItem.stringLightHangFt === undefined) newItem.stringLightHangFt = 0;
                    if (newItem.stringLightBulbSpacingFt === undefined) newItem.stringLightBulbSpacingFt = 2;

                }

        // Outside mode can run without a tent. When no tent is provided, we auto-size to placed items.
        let __AUTO_OUTSIDE_DIMS = null;
        function estimateOutsideDimsFromItems() {
            try {
                const list = Array.isArray(STATE.items) ? STATE.items : [];
                if (!list.length) return { w: 100, h: 100 };

                // If there's a structure tent item, use the largest one to define space
                // (this handles the case where a main tent was unlocked into a structure tent)
                let bestStructW = 0, bestStructH = 0;
                for (const item of list) {
                    const def = ITEM_DEFS[item.name] || {};
                    if (def.type === 'structure' &amp;&amp; def.tentType) {
                        const sw = (typeof item.width === 'number' ? item.width : (def.width || 0)) || 0;
                        const sh = (typeof item.height === 'number' ? item.height : (def.height || 0)) || 0;
                        if (sw * sh > bestStructW * bestStructH) {
                            bestStructW = sw;
                            bestStructH = sh;
                        }
                    }
                }
                if (bestStructW > 0 &amp;&amp; bestStructH > 0) {
                    // Use the structure tent dims like a main tent — no position shifting needed
                    return { w: bestStructW, h: bestStructH };
                }

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const item of list) {
                    const def = ITEM_DEFS[item.name] || {};
                    const wFt = (typeof item.width === 'number' ? item.width : (def.width || def.diameter || 0)) || 0;
                    const hFt = (typeof item.height === 'number' ? item.height : (def.height || def.diameter || 0)) || 0;
                    const wPx = wFt * CELL_SIZE;
                    const hPx = hFt * CELL_SIZE;
                    const x = (typeof item.x === 'number' ? item.x : 0);
                    const y = (typeof item.y === 'number' ? item.y : 0);
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + wPx);
                    maxY = Math.max(maxY, y + hPx);
                }
                if (!isFinite(minX) || !isFinite(minY) || !isFinite(maxX) || !isFinite(maxY)) {
                    return { w: 100, h: 100 };
                }

                const padPx = CELL_SIZE * 10; // 10ft padding
                const spanX = (maxX - minX) + padPx * 2;
                const spanY = (maxY - minY) + padPx * 2;
                const w = Math.max(20, Math.ceil(spanX / CELL_SIZE));
                const h = Math.max(20, Math.ceil(spanY / CELL_SIZE));

                // Shift so everything is visible (only matters when no tent defines origin)
                const shiftX = -minX + padPx;
                const shiftY = -minY + padPx;
                for (const item of list) {
                    if (typeof item.x === 'number') item.x += shiftX;
                    if (typeof item.y === 'number') item.y += shiftY;
                }

                return { w, h };
            } catch (e) {
                return { w: 100, h: 100 };
            }
        }

        function getSpaceDims() {
            if (MODE === 'inside') {
                return { w: (STATE.room &amp;&amp; STATE.room.width) ? STATE.room.width : 50, h: (STATE.room &amp;&amp; STATE.room.depth) ? STATE.room.depth : 50 };

                return { w: STATE.tent.width, h: STATE.tent.height };
            }
            if (!__AUTO_OUTSIDE_DIMS) __AUTO_OUTSIDE_DIMS = estimateOutsideDimsFromItems();
            return __AUTO_OUTSIDE_DIMS;

        function getWallSpacing(tentType, len) {
            if (tentType === 'Popup') return 10;
            if (tentType === 'Pole') {
              if (STATE.tent &amp;&amp; STATE.tent.poleBaySpacingFt) return STATE.tent.poleBaySpacingFt;
              if (STATE.tent) { const span = Math.min(STATE.tent.width, STATE.tent.height); if (span <= 30) return 15; }
              return 20;
            }
            if (tentType === 'CustomMarquee') return STATE.tent ? (STATE.tent.height / Math.max(1, (STATE.tent.marqueeSidePolesPerSide || 6) - 1)) : 10;
            if (tentType === 'Marquee' || tentType === 'Frame') {
               if (len % 15 === 0) return 15;
               return 20;
            }
            return 10;
        }

        function computeWallSegments(tentType, length) {
            const maxSeg = getWallSpacing(tentType, length);
            const count = Math.max(1, Math.ceil(length / maxSeg));
            const segLen = length / count;
            const segs = [];
            for (let i = 0; i < count; i++) segs.push({ start: i * segLen, length: segLen });
            return segs;
        }

        function symmetricInteriorPositions(length, maxSpan) {
            if (length <= maxSpan + 1e-6) return [length / 2];
            const sections = Math.ceil(length / maxSpan);
            const bay = length / sections;
            const out = [];
            for (let i = 1; i < sections; i++) out.push(i * bay);
            return out;
        }

        function computePolePeaks2D(w, h) {
            const longIsH = h >= w;
            const longLen = Math.max(w, h);
            const span = Math.min(w, h);
            const poleCenterMaxSpan = span <= 30 ? 15 : 20;
            const longPositions = symmetricInteriorPositions(longLen, poleCenterMaxSpan);
            const rowPositions = span <= 40 ? [span / 2] : symmetricInteriorPositions(span, poleCenterMaxSpan);

            const peaks = [];
            if (longIsH) {
                rowPositions.forEach((x) => longPositions.forEach((y) => peaks.push({ x, y })));
            } else {
                longPositions.forEach((x) => rowPositions.forEach((y) => peaks.push({ x, y })));
            }
            return peaks;
        }
        function updateTally() {

            STATE.items.forEach(item => {

                if (item.name === 'string-lights' &amp;&amp; item.tentLightingFor) return;
                if (item.name.includes('table') || item.name.includes('cocktail')) tables++;
                else if (item.name.startsWith('stage-') &amp;&amp; item.name !== 'stage-stageline-sl100') {
                    other++;

                    var c1 = Math.ceil(stW / pW) * Math.ceil(stD / pD);

                    const dotH = Math.max(2, Math.round(fy(0.06, size)));
                    const dotW = Math.max(1, Math.round(dotH * 0.35));
                    const step = Math.max(dotH + 2, Math.round(fy(0.22, size)));
                    for (let y = Math.round(fy(0.15, size)); y < size; y += step) {
                        ctx.fillRect(xPx - dotW / 2, y, dotW, dotH);
                    }
                    ctx.restore();
                };

                const drawSeamColor = (xFt) => {
                    const x = fx(xFt, COLOR_SIZE);
                    const sw = Math.max(2, fx(0.20, COLOR_SIZE));
                    const g = cctx.createLinearGradient(x - sw, 0, x + sw, 0);
                    g.addColorStop(0, 'rgba(15,23,42,0.00)');
                    g.addColorStop(0.35, 'rgba(15,23,42,0.08)');
                    g.addColorStop(0.5, 'rgba(255,255,255,0.18)');
                    g.addColorStop(0.65, 'rgba(15,23,42,0.10)');
                    g.addColorStop(1, 'rgba(15,23,42,0.00)');
                    cctx.fillStyle = g;
                    cctx.fillRect(x - sw, 0, sw * 2, COLOR_SIZE);

                    const off = fx(0.08, COLOR_SIZE);
                    drawStitchLine(cctx, x - off, COLOR_SIZE, 0.22);
                    drawStitchLine(cctx, x + off, COLOR_SIZE, 0.22);
                };

                const drawSeamHeight = (xFt) => {
                    const x = fx(xFt, PBR_SIZE);
                    const sw = Math.max(2, fx(0.18, PBR_SIZE));
                    const g = hctx.createLinearGradient(x - sw, 0, x + sw, 0);
                    g.addColorStop(0, 'rgb(124,124,124)');
                    g.addColorStop(0.5, 'rgb(168,168,168)');
                    g.addColorStop(1, 'rgb(124,124,124)');
                    hctx.fillStyle = g;
                    hctx.fillRect(x - sw, 0, sw * 2, PBR_SIZE);

                    const off = fx(0.08, PBR_SIZE);
                    const lw = Math.max(1, Math.round(fx(0.02, PBR_SIZE)));
                    hctx.fillStyle = 'rgb(160,160,160)';
                    hctx.fillRect(Math.round(x - off - lw / 2), 0, lw, PBR_SIZE);
                    hctx.fillRect(Math.round(x + off - lw / 2), 0, lw, PBR_SIZE);
                };

                const drawWrinkles = () => {
                    // Big, soft vinyl tension lines (avoid &quot;curtain&quot; striping)
                    const drawCrease = (isHighlight) => {
                        const x0 = Math.random() * COLOR_SIZE;
                        const drift = (Math.random() - 0.5) * COLOR_SIZE * 0.22;
                        const x1 = x0 + drift;
                        const x2 = x0 - drift;
                        const x3 = x0 + (Math.random() - 0.5) * COLOR_SIZE * 0.18;

                        cctx.save();
                        cctx.lineCap = 'round';
                        cctx.lineJoin = 'round';
                        cctx.shadowBlur = 18;
                        cctx.shadowColor = isHighlight ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
                        cctx.strokeStyle = isHighlight ? 'rgba(255,255,255,0.05)' : 'rgba(15,23,42,0.035)';
                        cctx.lineWidth = 10 + Math.random() * 22;
                        cctx.beginPath();
                        cctx.moveTo(x0, -40);
                        cctx.bezierCurveTo(x1, COLOR_SIZE * 0.33, x2, COLOR_SIZE * 0.66, x3, COLOR_SIZE + 40);
                        cctx.stroke();
                        cctx.restore();
                    };

                    // Subtle mottling so the wall isn't perfectly flat
                    cctx.save();
                    cctx.globalAlpha = 0.06;
                    for (let i = 0; i < 2200; i++) {
                        const x = Math.random() * COLOR_SIZE;
                        const y = Math.random() * COLOR_SIZE;
                        const s = 1 + Math.random() * 2;
                        cctx.fillStyle = Math.random() < 0.5 ? 'rgba(15,23,42,0.15)' : 'rgba(255,255,255,0.18)';
                        cctx.fillRect(x, y, s, s);
                    }
                    cctx.restore();

                    const creaseCount = 18;
                    for (let i = 0; i < creaseCount; i++) drawCrease(false);
                    for (let i = 0; i < Math.round(creaseCount * 0.45); i++) drawCrease(true);

                    // Height wrinkles (very subtle — just enough to catch light)
                    hctx.save();
                    hctx.globalAlpha = 0.22;
                    hctx.lineCap = 'round';
                    hctx.lineJoin = 'round';
                    hctx.strokeStyle = 'rgb(138,138,138)';
                    for (let i = 0; i < 12; i++) {
                        const x0 = Math.random() * PBR_SIZE;
                        const drift = (Math.random() - 0.5) * PBR_SIZE * 0.22;
                        const x1 = x0 + drift;
                        const x2 = x0 - drift;
                        const x3 = x0 + (Math.random() - 0.5) * PBR_SIZE * 0.18;
                        hctx.lineWidth = 5 + Math.random() * 10;
                        hctx.beginPath();
                        hctx.moveTo(x0, -20);
                        hctx.bezierCurveTo(x1, PBR_SIZE * 0.33, x2, PBR_SIZE * 0.66, x3, PBR_SIZE + 20);
                        hctx.stroke();
                    }
                    hctx.restore();
                };

                const drawWindow = (centerFt) => {
                    // Cathedral window sized/positioned like the reference (leave room under the eave)
                    const winW = 4.0;
                    const r = winW / 2;
                    const topMargin = 1.5;
                    const bottomMargin = 0.9;
                    const totalH = WALL_H_FT - topMargin - bottomMargin;
                    const rectH = Math.max(2.8, totalH - r);
                    const topY = topMargin;

                    const cy = topY + r;
                    const rectBottom = cy + rectH;
                    const midY = cy + rectH * 0.5;

                    const cxFt = centerFt;
                    const xL = cxFt - winW / 2;
                    const xR = cxFt + winW / 2;

                    // --- COLOR (transparent window you can actually see through) ---
                    const cX = fx(cxFt, COLOR_SIZE);
                    const cY = fy(cy, COLOR_SIZE);
                    const rx = fx(r, COLOR_SIZE);
                    const ry = fy(r, COLOR_SIZE);
                    const yTop = fy(topY, COLOR_SIZE);
                    const yBottom = fy(rectBottom, COLOR_SIZE);
                    const yMid = fy(midY, COLOR_SIZE);
                    const xLPx = fx(xL, COLOR_SIZE);
                    const xRPx = fx(xR, COLOR_SIZE);

                    const buildPath = () => {
                        cctx.beginPath();
                        if (cctx.ellipse) cctx.ellipse(cX, cY, rx, ry, 0, Math.PI, 0);
                        else {
                            cctx.save();
                            cctx.translate(cX, cY);
                            cctx.scale(1, ry / rx);
                            cctx.arc(0, 0, rx, Math.PI, 0);
                            cctx.restore();
                        }
                        cctx.lineTo(xRPx, yBottom);
                        cctx.lineTo(xLPx, yBottom);
                        cctx.closePath();
                    };

                    // 1) Punch the hole (alpha)
                    cctx.save();
                    buildPath();
                    cctx.clip();
                    cctx.globalCompositeOperation = 'destination-out';
                    cctx.fillStyle = 'rgba(0,0,0,1)';
                    cctx.fillRect(xLPx - 4, yTop - 4, (xRPx - xLPx) + 8, (yBottom - yTop) + 8);
                    cctx.restore();

                    // 2) Very light plastic tint + reflection (still see-through)
                    cctx.save();
                    buildPath();
                    cctx.clip();

                    const glassG = cctx.createLinearGradient(xLPx, yTop, xRPx, yBottom);
                    glassG.addColorStop(0, 'rgba(205,235,255,0.06)');
                    glassG.addColorStop(0.5, 'rgba(205,235,255,0.03)');
                    glassG.addColorStop(1, 'rgba(205,235,255,0.07)');
                    cctx.fillStyle = glassG;
                    cctx.fillRect(xLPx, yTop, xRPx - xLPx, yBottom - yTop);

                    // Reflection streak
                    cctx.save();
                    cctx.globalAlpha = 0.18;
                    cctx.translate(cX, yTop + (yBottom - yTop) * 0.55);
                    cctx.rotate(-0.35);
                    const rg = cctx.createLinearGradient(-rx, 0, rx, 0);
                    rg.addColorStop(0, 'rgba(255,255,255,0)');
                    rg.addColorStop(0.45, 'rgba(255,255,255,0.25)');
                    rg.addColorStop(0.55, 'rgba(255,255,255,0.25)');
                    rg.addColorStop(1, 'rgba(255,255,255,0)');
                    cctx.fillStyle = rg;
                    cctx.fillRect(-rx * 1.4, -(yBottom - yTop) * 0.8, rx * 2.8, (yBottom - yTop) * 1.6);
                    cctx.restore();

                    cctx.restore();

                    // 3) Frame + mullions (match reference)
                    const frameW = Math.max(4, fx(0.12, COLOR_SIZE));
                    const mullW = Math.max(3, fx(0.09, COLOR_SIZE));
                    cctx.strokeStyle = 'rgba(226,232,240,0.95)';

                    // Outer frame
                    cctx.lineWidth = frameW;
                    buildPath();
                    cctx.stroke();

                    const yBase = fy(cy, COLOR_SIZE);
                    cctx.lineWidth = mullW;

                    // Base-of-arch horizontal
                    cctx.beginPath();
                    cctx.moveTo(xLPx, yBase);
                    cctx.lineTo(xRPx, yBase);
                    cctx.stroke();

                    // Mid horizontal
                    cctx.beginPath();
                    cctx.moveTo(xLPx, yMid);
                    cctx.lineTo(xRPx, yMid);
                    cctx.stroke();

                    // Center vertical (rectangle only)
                    cctx.beginPath();
                    cctx.moveTo(cX, yBase);
                    cctx.lineTo(cX, yBottom);
                    cctx.stroke();

                    // Arch V mullions
                    const delta = 0.85;
                    const thetaL = (3 * Math.PI) / 2 - delta;
                    const thetaR = (3 * Math.PI) / 2 + delta;
                    const lx = cX + rx * Math.cos(thetaL);
                    const ly = cY + ry * Math.sin(thetaL);
                    const rxp = cX + rx * Math.cos(thetaR);
                    const ryp = cY + ry * Math.sin(thetaR);

                    cctx.beginPath(); cctx.moveTo(cX, yBase); cctx.lineTo(lx, ly); cctx.stroke();
                    cctx.beginPath(); cctx.moveTo(cX, yBase); cctx.lineTo(rxp, ryp); cctx.stroke();

                    // --- ROUGHNESS (window plastic glossier) ---
                    rctx.save();
                    rctx.beginPath();
                    const cXr = fx(cxFt, PBR_SIZE);
                    const cYr = fy(cy, PBR_SIZE);
                    const rxr = fx(r, PBR_SIZE);
                    const ryr = fy(r, PBR_SIZE);
                    if (rctx.ellipse) rctx.ellipse(cXr, cYr, rxr, ryr, 0, Math.PI, 0);
                    else {
                        rctx.save(); rctx.translate(cXr, cYr); rctx.scale(1, ryr / rxr); rctx.arc(0, 0, rxr, Math.PI, 0); rctx.restore();
                    }
                    rctx.lineTo(fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rctx.lineTo(fx(xL, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rctx.closePath();
                    rctx.clip();

                    const rg2 = rctx.createLinearGradient(fx(xL, PBR_SIZE), fy(topY, PBR_SIZE), fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rg2.addColorStop(0, 'rgb(60,60,60)');
                    rg2.addColorStop(1, 'rgb(90,90,90)');
                    rctx.fillStyle = rg2;
                    rctx.fillRect(fx(xL, PBR_SIZE), fy(topY, PBR_SIZE), fx(winW, PBR_SIZE), fy(rectH + r, PBR_SIZE));
                    rctx.restore();

                    // --- HEIGHT (raise frame/mullions slightly) ---
                    hctx.save();
                    hctx.strokeStyle = 'rgb(166,166,166)';
                    hctx.lineWidth = Math.max(2, fx(0.10, PBR_SIZE));
                    hctx.beginPath();
                    const cXh = fx(cxFt, PBR_SIZE);
                    const cYh = fy(cy, PBR_SIZE);
                    const rxh = fx(r, PBR_SIZE);
                    const ryh = fy(r, PBR_SIZE);
                    if (hctx.ellipse) hctx.ellipse(cXh, cYh, rxh, ryh, 0, Math.PI, 0);
                    else {
                        hctx.save(); hctx.translate(cXh, cYh); hctx.scale(1, ryh / rxh); hctx.arc(0, 0, rxh, Math.PI, 0); hctx.restore();
                    }
                    hctx.lineTo(fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    hctx.lineTo(fx(xL, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    hctx.closePath();
                    hctx.stroke();

                    hctx.lineWidth = Math.max(1, fx(0.06, PBR_SIZE));
                    const yBaseH = fy(cy, PBR_SIZE);
                    const yMidH = fy(midY, PBR_SIZE);
                    const yBottomH = fy(rectBottom, PBR_SIZE);

                    hctx.beginPath(); hctx.moveTo(fx(xL, PBR_SIZE), yBaseH); hctx.lineTo(fx(xR, PBR_SIZE), yBaseH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(fx(xL, PBR_SIZE), yMidH); hctx.lineTo(fx(xR, PBR_SIZE), yMidH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(cXh, yBottomH); hctx.stroke();

                    const lxH = cXh + rxh * Math.cos(thetaL);
                    const lyH = cYh + ryh * Math.sin(thetaL);
                    const rxHH = cXh + rxh * Math.cos(thetaR);
                    const ryHH = cYh + ryh * Math.sin(thetaR);
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(lxH, lyH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(rxHH, ryHH); hctx.stroke();
                    hctx.restore();
                };

                // --- COLOR MAP ---
                const baseGrad = cctx.createLinearGradient(0, 0, 0, COLOR_SIZE);
                baseGrad.addColorStop(0, '#f6f7f9');
                baseGrad.addColorStop(0.45, '#ffffff');
                baseGrad.addColorStop(1, '#f1f5f9');
                cctx.fillStyle = baseGrad;
                cctx.fillRect(0, 0, COLOR_SIZE, COLOR_SIZE);

                // Bottom scuff
                const scuff = cctx.createLinearGradient(0, fy(5.8, COLOR_SIZE), 0, COLOR_SIZE);
                scuff.addColorStop(0, 'rgba(15,23,42,0)');
                scuff.addColorStop(1, 'rgba(15,23,42,0.05)');
                cctx.fillStyle = scuff;
                cctx.fillRect(0, 0, COLOR_SIZE, COLOR_SIZE);

                // Edge reinforcements
                const edgeW = Math.max(2, fx(0.3, COLOR_SIZE));
                cctx.fillStyle = 'rgba(15,23,42,0.035)';
                cctx.fillRect(0, 0, edgeW, COLOR_SIZE);
                cctx.fillRect(COLOR_SIZE - edgeW, 0, edgeW, COLOR_SIZE);

                // Top and bottom hems
                const topHem = Math.max(2, Math.round(fy(0.35, COLOR_SIZE)));
                const bottomHem = Math.max(2, Math.round(fy(0.45, COLOR_SIZE)));

                const topG = cctx.createLinearGradient(0, 0, 0, topHem);
                topG.addColorStop(0, 'rgba(15,23,42,0.08)');
                topG.addColorStop(0.7, 'rgba(15,23,42,0.03)');
                topG.addColorStop(1, 'rgba(255,255,255,0.10)');
                cctx.fillStyle = topG;
                cctx.fillRect(0, 0, COLOR_SIZE, topHem);

                const bStart = COLOR_SIZE - bottomHem;
                const botG = cctx.createLinearGradient(0, bStart, 0, COLOR_SIZE);
                botG.addColorStop(0, 'rgba(255,255,255,0.10)');
                botG.addColorStop(0.35, 'rgba(15,23,42,0.03)');
                botG.addColorStop(1, 'rgba(15,23,42,0.10)');
                cctx.fillStyle = botG;
                cctx.fillRect(0, bStart, COLOR_SIZE, bottomHem);

                // --- PBR BASES ---
                // Roughness (higher = more matte)
                rctx.fillStyle = 'rgb(190,190,190)';
                rctx.fillRect(0, 0, PBR_SIZE, PBR_SIZE);

                // Height base
                hctx.fillStyle = 'rgb(128,128,128)';
                hctx.fillRect(0, 0, PBR_SIZE, PBR_SIZE);

                // Hems in height map
                const topHemH = Math.max(1, Math.round(fy(0.35, PBR_SIZE)));
                const botHemH = Math.max(1, Math.round(fy(0.45, PBR_SIZE)));

                const hTopG = hctx.createLinearGradient(0, 0, 0, topHemH);
                hTopG.addColorStop(0, 'rgb(120,120,120)');
                hTopG.addColorStop(0.5, 'rgb(155,155,155)');
                hTopG.addColorStop(1, 'rgb(128,128,128)');
                hctx.fillStyle = hTopG;
                hctx.fillRect(0, 0, PBR_SIZE, topHemH);

                const hbStart = PBR_SIZE - botHemH;
                const hBotG = hctx.createLinearGradient(0, hbStart, 0, PBR_SIZE);
                hBotG.addColorStop(0, 'rgb(128,128,128)');
                hBotG.addColorStop(0.5, 'rgb(158,158,158)');
                hBotG.addColorStop(1, 'rgb(118,118,118)');
                hctx.fillStyle = hBotG;
                hctx.fillRect(0, hbStart, PBR_SIZE, botHemH);

                // Center seam on 20' panels
                if (sp >= 18) {
                    drawSeamColor(sp / 2);
                    drawSeamHeight(sp / 2);

                    const sx = fx(sp / 2, PBR_SIZE);
                    const sw = Math.max(1, fx(0.22, PBR_SIZE));
                    rctx.fillStyle = 'rgb(205,205,205)';
                    rctx.fillRect(sx - sw, 0, sw * 2, PBR_SIZE);
                }

                // Wrinkles/noise
                // drawWrinkles(); // Disabled: the procedural wrinkle pass caused visible wavy artifacts on sidewalls.

                // Windows
                if (isWindow) {
                    if (sp >= 18) { drawWindow(sp * 0.30); drawWindow(sp * 0.70); }
                    else drawWindow(sp * 0.50);
                }

                // Roughness micro-noise
                const roughImg = rctx.getImageData(0, 0, PBR_SIZE, PBR_SIZE);
                for (let i = 0; i < roughImg.data.length; i += 4) {
                    const n = (Math.random() - 0.5) * 10;
                    const v = Math.max(0, Math.min(255, roughImg.data[i] + n));
                    roughImg.data[i] = v;
                    roughImg.data[i + 1] = v;
                    roughImg.data[i + 2] = v;
                    roughImg.data[i + 3] = 255;
                }
                rctx.putImageData(roughImg, 0, 0);

                // --- NORMAL MAP (from height) ---
                const heightData = hctx.getImageData(0, 0, PBR_SIZE, PBR_SIZE);
                const hD = heightData.data;

                const normalCanvas = document.createElement('canvas');
                normalCanvas.width = PBR_SIZE;
                normalCanvas.height = PBR_SIZE;
                const nctx = normalCanvas.getContext('2d');

                const normalImg = nctx.createImageData(PBR_SIZE, PBR_SIZE);
                const nD = normalImg.data;

                const strength = 1.6;
                const idx = (x, y) => (y * PBR_SIZE + x) * 4;
                const getH = (x, y) => {
                    const xi = Math.max(0, Math.min(PBR_SIZE - 1, x));
                    const yi = Math.max(0, Math.min(PBR_SIZE - 1, y));
                    return hD[idx(xi, yi)] / 255;
                };

                for (let y = 0; y < PBR_SIZE; y++) {
                    for (let x = 0; x < PBR_SIZE; x++) {
                        const hL = getH(x - 1, y);
                        const hR = getH(x + 1, y);
                        const hU = getH(x, y - 1);
                        const hDwn = getH(x, y + 1);
                        const dx = (hR - hL) * strength;
                        const dy = (hDwn - hU) * strength;
                        let nx = -dx;
                        let ny = -dy;
                        let nz = 1.0;
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1.0;
                        nx /= len; ny /= len; nz /= len;
                        const o = idx(x, y);
                        nD[o] = Math.round((nx * 0.5 + 0.5) * 255);
                        nD[o + 1] = Math.round((ny * 0.5 + 0.5) * 255);
                        nD[o + 2] = Math.round((nz * 0.5 + 0.5) * 255);
                        nD[o + 3] = 255;
                    }
                }
                nctx.putImageData(normalImg, 0, 0);

                const map = new THREE.CanvasTexture(colorCanvas);
                map.wrapS = map.wrapT = THREE.ClampToEdgeWrapping;
                if (map.colorSpace !== undefined &amp;&amp; THREE.SRGBColorSpace) map.colorSpace = THREE.SRGBColorSpace;
                else if (map.encoding !== undefined &amp;&amp; THREE.sRGBEncoding) map.encoding = THREE.sRGBEncoding;

                const roughnessMap = new THREE.CanvasTexture(roughCanvas);
                roughnessMap.wrapS = roughnessMap.wrapT = THREE.ClampToEdgeWrapping;

                const normalMap = new THREE.CanvasTexture(normalCanvas);
                normalMap.wrapS = normalMap.wrapT = THREE.ClampToEdgeWrapping;

                sidewallPbr[type] = { map: map, roughnessMap: roughnessMap, normalMap: normalMap };
                return sidewallPbr[type];
            };

            const makeSidewallMaterial = (texKey, isSolid, isClearWall) => {
                const pbr = getSidewallPbr(texKey);
                if (isClearWall) {
                    return new THREE.MeshStandardMaterial({
                        map: pbr.map,
                        roughness: 0.15,
                        metalness: 0.0,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85,
                        depthWrite: false,
                    });
                }
                const m = new THREE.MeshStandardMaterial({
                    map: pbr.map,
                    roughnessMap: pbr.roughnessMap,
                    normalMap: pbr.normalMap,
                    roughness: 1.0,
                    metalness: 0.0,
                    side: THREE.DoubleSide,
                    transparent: !isSolid,
                    alphaTest: !isSolid ? 0.02 : 0
                });
                if (m.normalScale &amp;&amp; m.normalScale.set) m.normalScale.set(0.35, 0.35);
                return m;
            };

            const getTex = (type) => {
                if (textures[type]) return textures[type];
                if (String(type || '').startsWith('sidewall_')) {
                    const pbr = getSidewallPbr(type);
                    textures[type] = pbr.map;
                    return pbr.map;
                }

                const c = document.createElement('canvas');
                c.width = 1024;
                c.height = 1024;
                const ctx = c.getContext('2d');

                if(type === 'grass') {
                    // DARK MOSSY GRASS (MATCHING MAIN APP)
                    const SIZE = 1024;
                    ctx.fillStyle = '#1a1812';
                    ctx.fillRect(0, 0, SIZE, SIZE);

                    const drawTileable = (drawFn) => {
                        [0, SIZE, -SIZE].forEach(ox => {
                            [0, SIZE, -SIZE].forEach(oy => {
                                drawFn(ox, oy);
                            });
                        });
                    };

                    for(let i=0; i<80000; i++) {
                        const x = Math.random() * SIZE;
                        const y = Math.random() * SIZE;
                        const w = 2 + Math.random() * 6;
                        const h = 2 + Math.random() * 6;
                        const rVal = Math.random();
                        if (rVal < 0.4) ctx.fillStyle = '#222b13';
                        else if (rVal < 0.7) ctx.fillStyle = '#2d381c';
                        else ctx.fillStyle = '#1e240f';
                        ctx.globalAlpha = 0.8;
                        ctx.fillRect(x, y, w, h);
                    }

                    ctx.globalAlpha = 0.4;
                    for(let i=0; i<25; i++) {
                        const cx = Math.random() * SIZE;
                        const cy = Math.random() * SIZE;
                        const r = 80 + Math.random() * 150;
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        g.addColorStop(0, '#3a4a25');
                        g.addColorStop(0.6, '#2d381c');
                        g.addColorStop(1, 'rgba(45, 56, 28, 0)');
                        drawTileable((ox, oy) => {
                            ctx.fillStyle = g;
                            ctx.translate(ox, oy);
                            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
                            ctx.translate(-ox, -oy);
                        });
                    }

                    ctx.globalAlpha = 0.25;
                    for(let i=0; i<40; i++) {
                        const cx = Math.random() * SIZE;
                        const cy = Math.random() * SIZE;
                        const r = 40 + Math.random() * 80;
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        g.addColorStop(0, '#4a3b2a');
                        g.addColorStop(1, 'transparent');
