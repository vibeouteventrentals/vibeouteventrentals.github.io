    <script>
    // Procedural ground tile generator for ALL ground types (matches 3D fallback)
    (function(){
      var TILE=256, cache={};
      function gen(type, night){
        var key=(type||'grass')+(night?'_n':'_d');
        if(cache[key]) return cache[key];
        var c=document.createElement('canvas'); c.width=TILE; c.height=TILE;
        var g=c.getContext('2d'), S=TILE;

        if(type==='gravel'){
          g.fillStyle=night?'#2e2e2e':'#7a7a7a'; g.fillRect(0,0,S,S);
          for(var i=0;i<4000;i++){var x=Math.random()*S,y=Math.random()*S,r=1+Math.random()*3,sh=night?(40+Math.random()*40):(80+Math.random()*80);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh*0.95)+')'; g.globalAlpha=0.7;
            g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();}
          for(var i=0;i<800;i++){var x=Math.random()*S,y=Math.random()*S,r=2+Math.random()*4,sh=night?(35+Math.random()*50):(90+Math.random()*70);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh*0.98)+','+Math.floor(sh*0.93)+')'; g.globalAlpha=0.6;
            g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();}
        } else if(type==='concrete'){
          g.fillStyle=night?'#4a4a4a':'#9a9a9a'; g.fillRect(0,0,S,S);
          for(var i=0;i<8000;i++){var x=Math.random()*S,y=Math.random()*S,sh=night?(55+Math.random()*35):(130+Math.random()*50);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh)+')'; g.globalAlpha=0.3;
            g.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);}
        } else if(type==='sand'){
          g.fillStyle=night?'#6b5a3a':'#d4bc82'; g.fillRect(0,0,S,S);
          for(var i=0;i<10000;i++){var x=Math.random()*S,y=Math.random()*S,rv=Math.random();
            if(night) g.fillStyle=rv<0.33?'#5e4f30':rv<0.66?'#7a6840':'#6b5a3a';
            else g.fillStyle=rv<0.33?'#c8b070':rv<0.66?'#dcc88e':'#bfa868';
            g.globalAlpha=0.5; g.fillRect(x,y,1+Math.random()*2,1+Math.random()*2);}
        } else if(type==='dirt'){
          g.fillStyle=night?'#2e1f12':'#7a5c3a'; g.fillRect(0,0,S,S);
          for(var i=0;i<6000;i++){var x=Math.random()*S,y=Math.random()*S,w=2+Math.random()*4,h=2+Math.random()*4,rv=Math.random();
            if(night) g.fillStyle=rv<0.33?'#3a2a18':rv<0.66?'#2a1c0e':'#352416';
            else g.fillStyle=rv<0.33?'#8b6b45':rv<0.66?'#6b4e30':'#9a7a50';
            g.globalAlpha=0.6; g.fillRect(x,y,w,h);}
        } else if(type==='asphalt'){
          g.fillStyle=night?'#1a1a1a':'#3e3e3e'; g.fillRect(0,0,S,S);
          for(var i=0;i<10000;i++){var x=Math.random()*S,y=Math.random()*S,sh=night?(15+Math.random()*30):(40+Math.random()*40);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh)+')'; g.globalAlpha=0.4;
            g.fillRect(x,y,1+Math.random()*1.5,1+Math.random()*1.5);}
        } else if(type==='parking_lot'){
          g.fillStyle=night?'#222222':'#4a4a4a'; g.fillRect(0,0,S,S);
          for(var i=0;i<8000;i++){var x=Math.random()*S,y=Math.random()*S,sh=night?(18+Math.random()*28):(45+Math.random()*35);
            g.fillStyle='rgb('+Math.floor(sh)+','+Math.floor(sh)+','+Math.floor(sh)+')'; g.globalAlpha=0.35;
            g.fillRect(x,y,1+Math.random()*1.5,1+Math.random()*1.5);}
          g.globalAlpha=night?0.12:0.15; g.strokeStyle=night?'#555':'#888'; g.lineWidth=2;
          g.setLineDash([12,18]); g.beginPath(); g.moveTo(S/2,0); g.lineTo(S/2,S); g.stroke(); g.setLineDash([]);
        } else {
          // grass (default)
          g.fillStyle=night?'#0f1009':'#1a1812'; g.fillRect(0,0,S,S);
          var pc=Math.round(30000*(S/512)*(S/512));
          for(var i=0;i<pc;i++){var x=Math.random()*S,y=Math.random()*S,w=2+Math.random()*4,h=2+Math.random()*4,r=Math.random();
            if(night) g.fillStyle=r<0.35?'#151c0b':r<0.65?'#1a2410':'#121807';
            else g.fillStyle=r<0.35?'#222b13':r<0.65?'#2d381c':'#1e240f';
            g.globalAlpha=0.8; g.fillRect(x,y,w,h);}
          var bc=Math.round(12000*(S/512)*(S/512)); g.globalAlpha=0.6;
          for(var i=0;i<bc;i++){var x=Math.random()*S,y=Math.random()*S,len=3+Math.random()*6;
            var ang=-Math.PI/2+(Math.random()-0.5)*0.9;
            if(night) g.strokeStyle=Math.random()<0.5?'#263818':'#2f4420';
            else g.strokeStyle=Math.random()<0.5?'#3d5a28':'#4a6b30';
            g.lineWidth=0.8+Math.random()*1.0; g.beginPath(); g.moveTo(x,y);
            g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len); g.stroke();}
        }
        g.globalAlpha=1.0; cache[key]=c.toDataURL('image/png'); return cache[key];
      }
      window.__groundTile=gen;
      // Backwards compat
      window.__grassTile=function(night){ return gen('grass',night); };
    })();
    </script>

        /* Watermark overlay */

        }

        }
        #watermark-overlay .wm-text {

        /* Hosted embed inventory carousel – docked to bottom of iframe */
        #addon-dock {

        #addon-dock:not(.collapsed) .addon-dock-collapsed { display: none; }

            justify-content: center;

        }
        .addon-dock-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        #addon-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex: 1;
            min-width: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #addon-tabs::-webkit-scrollbar { display: none; }
        .addon-tab {
            border: 1px solid rgba(0,0,0,0.08);

            border-radius: 999px;
            padding: 6px 10px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .addon-tab.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .addon-dock-collapse-btn {
            border: 1px solid rgba(0,0,0,0.08);
            background: #f1f5f9;
            color: #64748b;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .addon-dock-collapse-btn:hover { background: #e2e8f0; }
        #addon-carousel {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            padding: 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,0.12) transparent;
        }
        .addon-card {
            min-width: 100px;
            max-width: 100px;
            scroll-snap-align: start;
            border-radius: 14px;

            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-align: center;

        }
        .addon-card:hover { background: #eff6ff; border-color: #93c5fd; }
        .addon-card:active { transform: scale(0.97); }
        .addon-thumb-wrap {
            width: 100%;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(15,23,42,0.05);
            overflow: hidden;
        }
        .addon-thumb-shape {
            border: 1px solid rgba(0,0,0,0.08);
            opacity: 0.9;
            flex-shrink: 0;
        }
        .addon-name {
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #0f172a;
            line-height: 1.2;
            min-height: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .addon-sub { display: none; }
        .addon-add {
            padding: 4px 8px;
            border-radius: 999px;
            background: #2563eb;
            color: white;
            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border: none;
            user-select: none;
        }
        .addon-empty {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px dashed rgba(0,0,0,0.12);
            color: #94a3b8;
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        @media (max-width: 820px) {
            #addon-dock { padding: 6px 8px; }
            .addon-card {
                min-width: 90px;
                max-width: 90px;
                padding: 6px 5px;
            }
        }

        .on-screen-controls { position:absolute; bottom: 100px; left: 20px; right: 20px; display:flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
        .dpad { display:grid; grid-template-columns: repeat(3, 50px); gap: 5px; pointer-events: auto; }
        .control-btn { width: 50px; height: 50px; background: #ffffff; backdrop-filter: blur(5px); border: 2px solid #000000; border-radius: 12px; color: #000000; display:flex; align-items:center; justify-content:center; cursor: pointer; pointer-events: auto; user-select: none; transition: background 0.1s; font-weight: 900; font-size: 14px; }
        .control-btn svg { width: 20px; height: 20px; fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .nav-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .addon-nav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .control-btn:active { background: #dbeafe; border-color: #2563eb; }
        .control-btn.look:active { background: #cffafe; border-color: #0891b2; }
        .control-btn.elevation-up:active { background: #dcfce7; border-color: #16a34a; }
        .control-btn.elevation-down:active { background: #dcfce7; border-color: #16a34a; }

        /* Mobile: shrink 3D on-screen controls so they fit without overlapping */
        @media (max-width: 560px) {
            .on-screen-controls { bottom: 70px; left: 10px; right: 10px; }
            .dpad { grid-template-columns: repeat(3, 40px); gap: 3px; }
            .control-btn { width: 40px; height: 40px; border-radius: 10px; }
            .control-btn svg { width: 16px; height: 16px; }
        }
        @media (max-width: 380px) {
            .on-screen-controls { bottom: 60px; left: 6px; right: 6px; }
            .dpad { grid-template-columns: repeat(3, 34px); gap: 2px; }
            .control-btn { width: 34px; height: 34px; border-radius: 8px; border-width: 1.5px; }
            .control-btn svg { width: 14px; height: 14px; }
        }

        .wall-trigger { 
            position:absolute; border: 2px dashed rgba(255,255,255,0.3); cursor:pointer; z-index: 200; 
            display:flex; align-items:center; justify-content:center; font-size: 6px; font-weight: 900; color: white; 
        }
        .wall-trigger.active { background: #f97316; border-color: #fdba74; border-style: solid; box-shadow: 0 4px 10px rgba(249,115,22,0.3); }
        .stage-rail {
            position: absolute;
            background: rgba(148, 163, 184, 0.92);
            border: 1px solid rgba(30, 41, 59, 0.65);
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.18);
            pointer-events: none;
        }
        .stage-rail-trigger {
            position: absolute;
            border: 2px dashed rgba(56, 189, 248, 0.9);
            background: rgba(56, 189, 248, 0.08);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            color: rgba(30, 41, 59, 0.9);
            user-select: none;
            pointer-events: auto;
        }
        .stage-rail-trigger.active {
            border: 2px solid rgba(34, 197, 94, 0.95);
            background: rgba(34, 197, 94, 0.18);
        }
        .counter-rotate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content; pointer-events: none; }

        #tally-toggle-btn {
            position: fixed; top: calc(var(--ml-offset, 0px) + 10px); right: 140px; z-index: 5001;
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; pointer-events: auto;
        }
        #tally-toggle-btn:hover { background: rgba(255,255,255,1); box-shadow: 0 6px 24px rgba(0,0,0,0.14); transform: scale(1.05); }
        #tally-toggle-btn.open { background: #2563eb; border-color: #3b82f6; }
        #tally-toggle-btn.open svg { stroke: white; }

        #tally-dropdown {
            position: fixed; top: calc(var(--ml-offset, 0px) + 58px); right: 140px; z-index: 5000;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(14px);
            border: 1px solid rgba(0,0,0,0.06); border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            min-width: 200px; max-width: 260px;
            overflow: hidden; pointer-events: auto;
            transform: translateY(-8px); opacity: 0;
            transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
            visibility: hidden;
        }
        #tally-dropdown.open { transform: translateY(0); opacity: 1; visibility: visible; }
        .tally-header { padding: 10px 14px 6px; font-weight: 900; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: #2563eb; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .tally-item { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; }
        .tally-val { color: #2563eb; text-align: right; font-weight: 900; }

        /* Mobile: reposition tally button & dropdown to avoid overflow */
        @media (max-width: 560px) {
            #tally-toggle-btn { right: 12px; top: var(--ml-offset, 12px); margin-top: 8px; width: 36px; height: 36px; border-radius: 10px; }
            #tally-dropdown { right: 12px; top: calc(var(--ml-offset, 12px) + 48px); min-width: 180px; max-width: 220px; }
        }

        #tutorial-mode-btn {
            display: none !important;
        }
        #tutorial-mode-btn.on { display: none !important; }
        #tutorial-tip {
            display: none !important;
        }
        #tutorial-tip.active { display: none !important; }

        /* Drape Module 2D styles */
        .drape-point-2d {
            width: 12px; height: 12px; background: #fff; border: 2px solid #3b82f6; border-radius: 50%;
            position: absolute; pointer-events: none; z-index: 101;
        }
        .seg-label-group { cursor: default; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Multi-Layout Tab Bar -->
    <div id="ml-tab-bar" class="ml-tab-bar"></div>

    <!-- Branding logo (top-left) -->
    <img id="embed-brand-logo" style="display:none" />

    <!-- Watermark overlay -->
    <div id="watermark-overlay" style="display:none"></div>

    <button id="tutorial-mode-btn" onclick="toggleTutorial()">Help Mode: Off</button>

    <div id="selection-box"></div>
    <div id="viewport-2d">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>

            <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
    </button>
    <div id="tally-dropdown">
        <div class="tally-header">Inventory Tally</div>
        <div class="tally-item"><span id="tally-type-label">Tent</span> <span id="tent-type" class="tally-val">-</span></div>
        <div class="tally-item">Tables <span id="count-tables" class="tally-val">0</span></div>
        <div class="tally-item">Seats <span id="count-seats" class="tally-val">0</span></div>
        <div class="tally-item">Other <span id="count-other" class="tally-val">0</span></div>
        <div style="padding:4px 14px 10px; opacity:0.35; font-size:8px; font-weight:700; text-align:center; letter-spacing:0.08em;">TENTMAPPER</div>

    <div id="three-container"></div>
    <div id="three-overlay">
        <div class="overlay-box">
            <h2 id="walk-mode-title" class="text-lg font-black italic text-blue-400 uppercase">3D View</h2>
            <p id="walk-mode-desc" class="text-[9px] font-bold opacity-60 mt-1 uppercase tracking-widest">Use buttons or WASD to move</p>
        </div>
        <div class="absolute top-4 right-4 flex gap-2 pointer-events-auto">
            <button id="overlay-night-btn" class="w-12 h-12 rounded-full bg-white text-black border-2 border-black shadow-xl flex items-center justify-center hover:bg-gray-100 transition-all" onclick="toggleNightMode()" title="Toggle Day / Night" style="display:none"></button>
            <button class="w-12 h-12 rounded-full bg-white text-black border-2 border-black shadow-xl flex items-center justify-center hover:bg-gray-100 transition-all" onclick="snapshot3D()" title="Capture Screenshot"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:black;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        </div>
        
        <div class="on-screen-controls" id="on-screen-controls">
            <div class="dpad">
                <div></div>
                <div id="btn-move-f" class="control-btn" 
                     ontouchstart="event.preventDefault(); updateMove('f', true)" ontouchend="updateMove('f', false)" 
                     onmousedown="updateMove('f', true)" onmouseup="updateMove('f', false)" onmouseleave="updateMove('f', false)"><svg viewBox="0 0 24 24"><path d="M12 6l8 12H4z" fill="currentColor" stroke="none"/></svg></div>
                <div></div>
                
                <div id="btn-move-l" class="control-btn" 
                     ontouchstart="event.preventDefault(); updateMove('l', true)" ontouchend="updateMove('l', false)" 
                     onmousedown="updateMove('l', true)" onmouseup="updateMove('l', false)" onmouseleave="updateMove('l', false)"><svg viewBox="0 0 24 24"><path d="M6 12l12-8v16z" fill="currentColor" stroke="none"/></svg></div>
                
                <div id="btn-move-b" class="control-btn" 
                     ontouchstart="event.preventDefault(); updateMove('b', true)" ontouchend="updateMove('b', false)" 
                     onmousedown="updateMove('b', true)" onmouseup="updateMove('b', false)" onmouseleave="updateMove('b', false)"><svg viewBox="0 0 24 24"><path d="M12 18L4 6h16z" fill="currentColor" stroke="none"/></svg></div>
                
                <div id="btn-move-r" class="control-btn" 
                     ontouchstart="event.preventDefault(); updateMove('r', true)" ontouchend="updateMove('r', false)" 
                     onmousedown="updateMove('r', true)" onmouseup="updateMove('r', false)" onmouseleave="updateMove('r', false)"><svg viewBox="0 0 24 24"><path d="M18 12L6 4v16z" fill="currentColor" stroke="none"/></svg></div>
            </div>

            <div class="flex flex-col gap-6 items-end pointer-events-auto">

                             onmousedown="updateMove('lookUp', true)" onmouseup="updateMove('lookUp', false)" onmouseleave="updateMove('lookUp', false)"><svg viewBox="0 0 24 24"><path d="M12 6l8 12H4z" fill="currentColor" stroke="none"/></svg></div>

                            <div class="control-btn look" 
                                 ontouchstart="event.preventDefault(); updateMove('lookL', true)" ontouchend="updateMove('lookL', false)"

                            <div class="control-btn look" 
                                 ontouchstart="event.preventDefault(); updateMove('lookR', true)" ontouchend="updateMove('lookR', false)"
                                 onmousedown="updateMove('lookR', true)" onmouseup="updateMove('lookR', false)" onmouseleave="updateMove('lookR', false)"><svg viewBox="0 0 24 24"><path d="M18 12L6 4v16z" fill="currentColor" stroke="none"/></svg></div>
                        </div>

                </div>
            </div>

        <!-- Optional: hosted embed inventory carousel is now in #addon-dock below -->

        <div class="embed-3d-footer">

        // ── Multi-Layout tab switching ──
        function initMultiLayoutTabs() {
            if (!MULTI_LAYOUTS || MULTI_LAYOUTS.length === 0) return;
            var bar = document.getElementById('ml-tab-bar');
            if (!bar) return;
            bar.classList.add('active');
            // First tab = current layout (always included)
            var defaultTab = document.createElement('button');
            defaultTab.className = 'ml-tab active';
            defaultTab.textContent = 'Default';
            defaultTab.setAttribute('data-ml-idx', '0');
            defaultTab.onclick = function() { switchMultiLayout(0); };
            bar.appendChild(defaultTab);
            // Additional tabs from uploaded .tm files
            for (var i = 0; i < MULTI_LAYOUTS.length; i++) {
                var tab = document.createElement('button');
                tab.className = 'ml-tab';
                tab.textContent = MULTI_LAYOUTS[i].label || ('Layout ' + (i + 1));
                tab.setAttribute('data-ml-idx', String(i + 1));
                tab.onclick = (function(idx) { return function() { switchMultiLayout(idx); }; })(i + 1);
                bar.appendChild(tab);
            }
            // Set CSS variable for multi-layout offset — all fixed UI elements use this
            function updateMlOffset() {
                var h = bar.offsetHeight || 40;
                document.body.style.setProperty('--ml-offset', h + 'px');
                var tutBtn = document.getElementById('tutorial-mode-btn');
                if (tutBtn) tutBtn.style.top = (h + 14) + 'px';
                var brandLogo = document.getElementById('embed-brand-logo');
                if (brandLogo) brandLogo.style.top = (h + 10) + 'px';
                try { window.parent.postMessage({ type: 'tm-extend-iframe', extraHeight: h }, '*'); } catch(e) {}
            }
            updateMlOffset();
            // Keep offset in sync when bar resizes (orientation change, dynamic tabs)
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function() { updateMlOffset(); }).observe(bar);
            }
            window.addEventListener('resize', updateMlOffset);
        }

        // ── Watermark compositing for screenshots ──
        function compositeWatermark(canvas, callback) {
            if (!WATERMARK_ON_SCREENSHOT || WATERMARK_MODE === 'none') { callback(canvas); return; }
            var tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = canvas.width; tmpCanvas.height = canvas.height;
            var ctx = tmpCanvas.getContext('2d');
            ctx.drawImage(canvas, 0, 0);
            ctx.save();
            ctx.globalAlpha = WATERMARK_OPACITY;
            if (WATERMARK_MODE === 'text' && WATERMARK_TEXT) {
                var fontSize = Math.max(24, Math.floor(canvas.width * 0.06));
                ctx.font = '900 italic ' + fontSize + 'px sans-serif';
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(-25 * Math.PI / 180);
                ctx.fillText(WATERMARK_TEXT.toUpperCase(), 0, 0);
            } else if (WATERMARK_MODE === 'logo' && WATERMARK_LOGO_URL) {
                var wmLogo = new Image(); wmLogo.crossOrigin = 'anonymous';
                wmLogo.onload = function() {
                    var maxW = canvas.width * 0.35, maxH = canvas.height * 0.25;
                    var scale = Math.min(maxW / wmLogo.width, maxH / wmLogo.height, 1);
                    var w = wmLogo.width * scale, h = wmLogo.height * scale;
                    ctx.drawImage(wmLogo, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                    ctx.restore();
                    callback(tmpCanvas);
                };
                wmLogo.onerror = function() { ctx.restore(); callback(tmpCanvas); };
                wmLogo.src = WATERMARK_LOGO_URL;
                return; // async path
            }
            ctx.restore();
            callback(tmpCanvas);
        }

        function humanizeChairStyle(style) {
            try {
                const raw = String(style || '');
                const parts = raw.split('_').filter(Boolean);
                if (!parts.length) return raw;
                return parts.map((p) => (p.charAt(0).toUpperCase() + p.slice(1))).join(' ');
            } catch (e) {
                return String(style || '');
            }
        }

        function chairChipColor(style) {
            const s = String(style || '').toLowerCase();
            if (s.indexOf('gold') !== -1) return '#fbbf24';
            if (s.indexOf('silver') !== -1) return '#cbd5e1';
            if (s.indexOf('black') !== -1) return '#111827';
            if (s.indexOf('white') !== -1) return '#f8fafc';
            if (s.indexOf('walnut') !== -1) return '#8b5a2b';
            if (s.indexOf('beech') !== -1) return '#d4a373';
            if (s.indexOf('oak') !== -1) return '#c49a6c';
            if (s.indexOf('fruitwood') !== -1) return '#b45309';
            if (s.indexOf('rustic') !== -1) return '#7c4a12';
            return '#94a3b8';
        }

        function updateAddonPickerVisibility() {

                var canEditIn2D = VIEW_MODE !== '3d';
                var is3D = STATE.view === '3d';
                var shouldShow = !!ADDON_PICKER_ENABLED && hasTabs && canEditIn2D && !is3D;

                addonDockEl.style.display = shouldShow ? 'block' : 'none';
                if (!shouldShow) {

                    var tb = document.getElementById('unified-toolbar');

                function getAddonTabs() {

        function renderAddonCards() {
            try {
                if (!addonCarouselEl) return;
                addonCarouselEl.innerHTML = '';

                const tabs = getAddonTabs();
                const activeTab = tabs.find(function(tab) { return tab.key === addonActiveTabKey; }) || tabs[0];
                if (!activeTab || !Array.isArray(activeTab.items) || activeTab.items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'addon-empty';
                    empty.innerText = 'No items in this category';
                    addonCarouselEl.appendChild(empty);
                    return;
                }

                activeTab.items.forEach(function(key) {
                    const def = ITEM_DEFS[key];
                    if (!def) return;

                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'addon-card';

                    const thumbWrap = document.createElement('div');
                    thumbWrap.className = 'addon-thumb-wrap';

                    const thumb = document.createElement('div');
                    thumb.className = 'addon-thumb-shape';
                    thumb.style.background = def.color || '#94a3b8';
                    const isRound = def.type === 'round';
                    const thumbW = isRound ? 28 : Math.min(42, Math.max(16, Number(def.width || def.diameter || 2) * 6));
                    const thumbH = isRound ? 28 : Math.min(28, Math.max(14, Number(def.height || def.diameter || 2) * 6));
                    thumb.style.width = thumbW + 'px';
                    thumb.style.height = thumbH + 'px';
                    thumb.style.borderRadius = isRound ? '999px' : '6px';
                    thumbWrap.appendChild(thumb);

                    const nameEl = document.createElement('div');
                    nameEl.className = 'addon-name';
                    nameEl.innerText = def.displayName || key;

                    const subEl = document.createElement('div');
                    subEl.className = 'addon-sub';
                    subEl.innerText = String(def.type || activeTab.label || '').toUpperCase();

                    const addEl = document.createElement('div');
                    addEl.className = 'addon-add';
                    addEl.innerText = 'Tap to add';

                    card.appendChild(thumbWrap);
                    card.appendChild(nameEl);
                    card.appendChild(subEl);
                    card.appendChild(addEl);

                    const handleAddFromCard = function(ev) {
                        if (ev) {
                            if (ev.cancelable) ev.preventDefault();
                            ev.stopPropagation();
                        }
                        const now = Date.now();
                        if (now - addonLastAddAt < 220) return;
                        addonLastAddAt = now;
                        addItemFromPicker(key);
                    };

                    card.addEventListener('click', handleAddFromCard);
                    card.addEventListener('pointerup', handleAddFromCard);
                    addonCarouselEl.appendChild(card);
                });
            } catch (e) {}
        }

                    btn.type = 'button';

                    };

                });

        }

        function setupAddonPicker() {
            try {
                if (!addonDockEl || !addonTabsEl || !addonCarouselEl) return;
                addonTabsEl.innerHTML = '';
                addonCarouselEl.innerHTML = '';

                if (!ADDON_PICKER_ENABLED) {
                    updateAddonPickerVisibility();

                const tabs = getAddonTabs();
                if (!tabs.length) {
                    updateAddonPickerVisibility();
                    return;
                }

                const activeExists = tabs.some(function(tab) { return tab.key === addonActiveTabKey; });
                if (!activeExists) addonActiveTabKey = tabs[0].key;

                renderAddonTabs();
                renderAddonCards();
                updateAddonPickerVisibility();
            } catch (e) {}

        function addItemFromPicker(itemKey) {
            try {
                const rawKey = String(itemKey || '').trim();
                if (!rawKey) return;

                let key = rawKey;
                let def = ITEM_DEFS[key];

                // Chair-model pseudo key support: "chair3d:<style>" adds a chair-single with a fixed chairStyle.
                let chairStyleOverride = null;
                let chiavariCushionOverride = null;
                if (isChairAddonKey(rawKey)) {
                    const style = chairStyleFromAddonKey(rawKey);
                    key = 'chair-single';
                    def = ITEM_DEFS[key];
                    chairStyleOverride = style;

                    // If this is a Chiavari chair, respect the global chiavari cushion toggle unless the style explicitly includes cushion.
                    if (String(style || '').startsWith('chiavari_')) {
                        chiavariCushionOverride = (style === 'chiavari_white_cushion') ? true : STATE.chiavariCushion;
                    }
                }

                if (!def) return;

                const dims = getSpaceDims();
                const w = dims.w;
                const d = dims.h;

                const iw = (def.width || def.diameter || 1);
                const ih = (def.height || def.diameter || 1);

                let fx = w / 2;
                let fz = d / 2;

                // Prefer the currently selected item as an anchor so additions feel local in 2D.
                const selectedItem = Array.isArray(STATE.selectedIds)
                    ? STATE.items.find(function(item) { return STATE.selectedIds.indexOf(item.id) !== -1; })
                    : null;
                if (selectedItem) {
                    const selectedDef = ITEM_DEFS[selectedItem.name] || {};
                    const selectedW = Number(selectedItem.width || selectedDef.width || selectedDef.diameter || 1) || 1;
                    fx = (((Number(selectedItem.x) || 0) / CELL_SIZE) - borderCells) + (selectedW / 2);
                    fz = (((Number(selectedItem.y) || 0) / CELL_SIZE) - borderCells) + ((Number(selectedItem.height || selectedDef.height || selectedDef.diameter || 1) || 1) / 2);
                }

                    const dir = new THREE.Vector3();
                    camera.getWorldDirection(dir);

                    const denom = dir.y;
                    if (Math.abs(denom) > 0.0001) {
                        const t = (0 - camera.position.y) / denom;
                        if (isFinite(t) && t > 0) {
                            fx = camera.position.x + dir.x * t;
                            fz = camera.position.z + dir.z * t;
                        } else {
                            const dist = 18;
                            fx = camera.position.x + dir.x * dist;
                            fz = camera.position.z + dir.z * dist;
                        }
                    } else {
                        const dist = 18;
                        fx = camera.position.x + dir.x * dist;
                        fz = camera.position.z + dir.z * dist;
                    }

                // Keep within bounds (with half-size margin)

                const newItem = {

        // Outside mode can run without a tent. When no tent is provided, we auto-size to placed items.
        let __AUTO_OUTSIDE_DIMS = null;
        function estimateOutsideDimsFromItems() {
            try {
                const list = Array.isArray(STATE.items) ? STATE.items : [];
                if (!list.length) return { w: 100, h: 100 };
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const item of list) {
                    const def = ITEM_DEFS[item.name] || {};
                    const wFt = (typeof item.width === 'number' ? item.width : (def.width || def.diameter || 0)) || 0;
                    const hFt = (typeof item.height === 'number' ? item.height : (def.height || def.diameter || 0)) || 0;
                    const wPx = wFt * CELL_SIZE;
                    const hPx = hFt * CELL_SIZE;
                    const x = (typeof item.x === 'number' ? item.x : 0);
                    const y = (typeof item.y === 'number' ? item.y : 0);
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + wPx);
                    maxY = Math.max(maxY, y + hPx);
                }
                if (!isFinite(minX) || !isFinite(minY) || !isFinite(maxX) || !isFinite(maxY)) {
                    return { w: 100, h: 100 };
                }

                const padPx = CELL_SIZE * 10; // 10ft padding
                const spanX = (maxX - minX) + padPx * 2;
                const spanY = (maxY - minY) + padPx * 2;
                const w = Math.max(20, Math.ceil(spanX / CELL_SIZE));
                const h = Math.max(20, Math.ceil(spanY / CELL_SIZE));

                // Shift so everything is visible (only matters when no tent defines origin)
                const shiftX = -minX + padPx;
                const shiftY = -minY + padPx;
                for (const item of list) {
                    if (typeof item.x === 'number') item.x += shiftX;
                    if (typeof item.y === 'number') item.y += shiftY;
                }

                return { w, h };
            } catch (e) {
                return { w: 100, h: 100 };
            }
        }

            if (STATE.tent && typeof STATE.tent.width === 'number' && typeof STATE.tent.height === 'number') {
                return { w: STATE.tent.width, h: STATE.tent.height };
            }
            if (!__AUTO_OUTSIDE_DIMS) __AUTO_OUTSIDE_DIMS = estimateOutsideDimsFromItems();

                    const relX = (e.clientX - centerX) / STATE.scale;
                    const relY = (e.clientY - centerY) / STATE.scale;
                    const tx = (relX * Math.cos(rad) - relY * Math.sin(rad)) + canvas.offsetWidth / 2;
                    const ty = (relX * Math.sin(rad) + relY * Math.cos(rad)) + canvas.offsetHeight / 2;

                    if (!STATE.tapePoints.start || (STATE.tapePoints.start && STATE.tapePoints.end)) {

                    const rect = canvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const rad = (-STATE.rotation * Math.PI) / 180;
                    const relX = (e.clientX - centerX) / STATE.scale;
                    const relY = (e.clientY - centerY) / STATE.scale;
                    const tx = (relX * Math.cos(rad) - relY * Math.sin(rad)) + canvas.offsetWidth / 2;
                    const ty = (relX * Math.sin(rad) + relY * Math.cos(rad)) + canvas.offsetHeight / 2;
                    
                    renderTapePreview(STATE.tapePoints.start.x, STATE.tapePoints.start.y, tx, ty);
                    return;

                if (!start) return;
                const current = { x: e.clientX, y: e.clientY };
                const x = Math.min(start.x, current.x);

        function getWallSpacing(tentType, len) {
            if (tentType === 'Popup') return 10;
            if (tentType === 'Pole') {
              if (STATE.tent && STATE.tent.poleBaySpacingFt) return STATE.tent.poleBaySpacingFt;
              if (STATE.tent) { const span = Math.min(STATE.tent.width, STATE.tent.height); if (span <= 30) return 15; }
              return 20;
            }
            if (tentType === 'CustomMarquee') return STATE.tent ? (STATE.tent.height / Math.max(1, (STATE.tent.marqueeSidePolesPerSide || 6) - 1)) : 10;
            if (tentType === 'Marquee' || tentType === 'Frame') {
               if (len % 15 === 0) return 15;
               return 20;
            }
            return 10;
        }

        function computeWallSegments(tentType, length) {
            const maxSeg = getWallSpacing(tentType, length);
            const count = Math.max(1, Math.ceil(length / maxSeg));
            const segLen = length / count;
            const segs = [];
            for (let i = 0; i < count; i++) segs.push({ start: i * segLen, length: segLen });
            return segs;
        }

        function symmetricInteriorPositions(length, maxSpan) {
            if (length <= maxSpan + 1e-6) return [length / 2];
            const sections = Math.ceil(length / maxSpan);
            const bay = length / sections;
            const out = [];
            for (let i = 1; i < sections; i++) out.push(i * bay);
            return out;
        }

        function computePolePeaks2D(w, h) {
            const longIsH = h >= w;
            const longLen = Math.max(w, h);
            const span = Math.min(w, h);
            const poleCenterMaxSpan = span <= 30 ? 15 : 20;
            const longPositions = symmetricInteriorPositions(longLen, poleCenterMaxSpan);
            const rowPositions = span <= 40 ? [span / 2] : symmetricInteriorPositions(span, poleCenterMaxSpan);

            const peaks = [];
            if (longIsH) {
                rowPositions.forEach((x) => longPositions.forEach((y) => peaks.push({ x, y })));
            } else {
                longPositions.forEach((x) => rowPositions.forEach((y) => peaks.push({ x, y })));
            }
            return peaks;
        }

                    t.style.transform = isV ? 'translateX(-50%)' : 'translateY(-50%)'; t.innerText = active ? (activeType === 'solid' ? 'SOLID' : 'WIN') : '';
                    t.style.zIndex = '200';
                    t.onclick = (e) => { 
                        e.stopPropagation(); if(!STATE.tent.sidewalls) STATE.tent.sidewalls = [];
                        pushHistory();
                        const desiredType = e.shiftKey ? 'solid' : 'window';
                        const i = STATE.tent.sidewalls.findIndex(w => w.side === side && w.index === idx);
                        if(i > -1) {
                          if (STATE.tent.sidewalls[i].type !== desiredType) STATE.tent.sidewalls[i].type = desiredType;
                          else STATE.tent.sidewalls.splice(i, 1);
                        } else {
                          STATE.tent.sidewalls.push({side, index: idx, type: desiredType});
                        }
                        render2D();
                        showTip('walls');
                    };
                    canvas.appendChild(t);
                };
                const addPole = (x, y, color = "#000") => {
                    const p = document.createElement('div'); p.style.position = 'absolute'; p.style.width = '10px'; p.style.height = '10px';
                    p.style.background = color; p.style.borderRadius = '50%'; p.style.zIndex = '150';
                    p.style.left = (x + borderCells) * CELL_SIZE - 5 + 'px'; p.style.top = (y + borderCells) * CELL_SIZE - 5 + 'px';
                    if(color !== "#000") p.style.boxShadow = '0 0 10px rgba(244,63,94,0.6)'; canvas.appendChild(p);
                };

                // Hex wall triggers: rotated clickable segments.
                const createHexTrig = (idx, mx, my, len, deg) => {
                    const existingWall = (STATE.tent.sidewalls || []).find(w => w.side === 'hex' && w.index === idx);
                    const active = !!existingWall;
                    const activeType = existingWall?.type;
                    const t = document.createElement('div'); t.className = 'wall-trigger' + (active ? ' active' : '');
                    t.style.left = (mx + borderCells) * CELL_SIZE + 'px'; t.style.top = (my + borderCells) * CELL_SIZE + 'px';
                    t.style.width = (len * CELL_SIZE) + 'px'; t.style.height = '18px';
                    t.style.transform = 'translate(-50%, -50%) rotate(' + deg + 'deg)';
                    t.innerText = active ? (activeType === 'solid' ? 'SOLID' : 'WIN') : '';
                    t.style.zIndex = '200';
                    t.onclick = (e) => {
                        e.stopPropagation(); if(!STATE.tent.sidewalls) STATE.tent.sidewalls = [];
                        pushHistory();
                        const desiredType = e.shiftKey ? 'solid' : 'window';
                        const i = STATE.tent.sidewalls.findIndex(w => w.side === 'hex' && w.index === idx);
                        if(i > -1) {
                          if (STATE.tent.sidewalls[i].type !== desiredType) STATE.tent.sidewalls[i].type = desiredType;
                          else STATE.tent.sidewalls.splice(i, 1);
                        } else {
                          STATE.tent.sidewalls.push({side: 'hex', index: idx, type: desiredType});
                        }
                        render2D();
                        showTip('walls');
                    };
                    canvas.appendChild(t);
                };

                if (tT === 'Hex') {
                    const sideLen = STATE.tent.sideLength || (h / 2);
                    const cx = w / 2; const cy = h / 2;
                    const verts = Array.from({ length: 6 }, (_, i) => {
                        const a = (-Math.PI / 2) + i * (Math.PI / 3);
                        return { x: cx + sideLen * Math.cos(a), y: cy + sideLen * Math.sin(a) };
                    });
                    // Triggers + poles
                    for (let i = 0; i < 6; i++) {
                        const a = verts[i]; const b = verts[(i + 1) % 6];
                        const mx = (a.x + b.x) / 2; const my = (a.y + b.y) / 2;
                        const len = Math.hypot(b.x - a.x, b.y - a.y);
                        const deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
                        createHexTrig(i, mx, my, len, deg);
                    }
                    verts.forEach(v => addPole(v.x, v.y));
                } else {
                    const wSegs = computeWallSegments(tT, w);
                    const hSegs = computeWallSegments(tT, h);
                    wSegs.forEach((seg, i) => { createTrig('top', seg.start, 0, seg.length, false, i); createTrig('bottom', seg.start, h, seg.length, false, i); });
                    hSegs.forEach((seg, i) => { createTrig('left', 0, seg.start, seg.length, true, i); createTrig('right', w, seg.start, seg.length, true, i); });

                    const poleGapW = tT === 'Pole' ? 10 : wSp;
                    const poleGapH = tT === 'Pole' ? 10 : hSp;
                    if (tT === 'CustomMarquee') {
                        var cmSpp = STATE.tent.marqueeSidePolesPerSide || 6;
                        var cmCp = STATE.tent.marqueeCenterPoles || 3;
                        for (var ci = 0; ci < cmSpp; ci++) {
                            var cyPos = cmSpp > 1 ? (ci / (cmSpp - 1)) * h : h / 2;
                            addPole(0, cyPos); addPole(w, cyPos);
                        }
                        if (cmCp === 1) { addPole(w / 2, h / 2, "#f43f5e"); }
                        else { var cmCpSp = h / (cmCp + 1); for (var cj = 0; cj < cmCp; cj++) { addPole(w / 2, (cj + 1) * cmCpSp, "#f43f5e"); } }
                    } else {
                    for(let x=0; x<=w; x+=poleGapW) { addPole(x,0); addPole(x, h); }
                    for(let y=poleGapH; y<h; y+=poleGapH) { addPole(0,y); addPole(w, y); }
                    if(tT === 'Pole') { const peaks = computePolePeaks2D(w, h); peaks.forEach(p => addPole(p.x, p.y, "#f43f5e")); }
                    }
                }
            }

            // Render Finalized Tape Points
            if (STATE.tapePoints.start && STATE.tapePoints.end) {
                const x1 = STATE.tapePoints.start.x; const y1 = STATE.tapePoints.start.y;

                }

                if(def.type === 'stringlights' && item.stringLightPoints && item.stringLightPoints.length >= 2){
                    const svgNS = 'http://www.w3.org/2000/svg';
                    const svg = document.createElementNS(svgNS, 'svg');
                    svg.setAttribute('width', '1');

                    const pts = item.stringLightPoints;
                    const hangFt = item.stringLightHangFt ?? 1;

                    const wireColor = item.color || '#111111';
                    const ampPx = Math.min(6, hangFt) * CELL_SIZE * 0.35;

                    const quadAt = (p0, ctrl, p1, t) => {

                      const p0 = pts[i];

                      const g = document.createElementNS(svgNS, 'g');
                      g.setAttribute('transform', 'translate(' + lp.x + ', ' + lp.y + ')');

                      const rect = document.createElementNS(svgNS, 'rect');
                      rect.setAttribute('x', '-42'); rect.setAttribute('y', '-14');
                      rect.setAttribute('width', '84'); rect.setAttribute('height', '28');
                      rect.setAttribute('rx', '14');
                      rect.setAttribute('fill', isSelected ? '#0f172a' : '#334155');
                      rect.setAttribute('stroke', isSelected ? '#38bdf8' : 'transparent');
                      rect.setAttribute('stroke-width', '2');

                      t.setAttribute('text-anchor', 'middle');
                      t.setAttribute('y', '4');

                      t.style.fontSize = '10px';
                      t.style.fontWeight = '900';

                    };

                    // Bulbs across total run
                    const safeSpacing = Math.max(0.5, spacingFt);
                    const bulbCount = Math.max(2, Math.floor(totalFt / safeSpacing) + 1);
                    for(let i=0;i<bulbCount;i++){

                      const loc = locateAlongRun(dist);

                      const by = pt.y + loc.ny*6;

                      svg.appendChild(c);

                    const tr = document.createElementNS(svgNS, 'rect');
                    tr.setAttribute('x','-78'); tr.setAttribute('y','-20');
                    tr.setAttribute('width','156'); tr.setAttribute('height','40');
                    tr.setAttribute('rx','20');
                    tr.setAttribute('fill', isSelected ? '#0f172a' : '#334155');
                    tr.setAttribute('stroke', isSelected ? '#38bdf8' : 'transparent');
                    tr.setAttribute('stroke-width', '2');
                    tr.setAttribute('opacity','0.95');

                    const tt = document.createElementNS(svgNS, 'text');
                    tt.setAttribute('text-anchor','middle');
                    tt.setAttribute('y','-3');
                    tt.setAttribute('fill','white');
                    tt.style.fontSize = '10px';
                    tt.style.fontWeight = '900';
                    tt.style.fontStyle = 'italic';
                    tt.style.pointerEvents = 'none';
                    tt.textContent = 'TOTAL ' + totalFt.toFixed(1) + "'";
                    tg.appendChild(tt);

                    svg.appendChild(tg);

                    canvas.appendChild(svg);
                    svg.style.pointerEvents = 'auto';
                    svg.onclick = (e) => { e.stopPropagation(); if (!isSelected && !STATE.isTapeActive) { STATE.selectedIds = [item.id]; } render2D(); };

                    const isPrimary = isSelected && STATE.selectedIds[STATE.selectedIds.length - 1] === item.id;
                    if (isPrimary) {
                        const toolbar = document.createElement('div'); toolbar.className = 'item-toolbar'; toolbar.style.zIndex = '3001'; toolbar.onclick = (e) => e.stopPropagation();
                        const colorGroup = document.createElement('div'); colorGroup.className = 'flex gap-2 px-2';
                        ['#ffffff', '#111111'].forEach(cw => {
                          const dot = document.createElement('div'); dot.className = 'color-dot' + ((item.color || '#111111') === cw ? ' active' : ''); dot.style.background = cw; dot.style.width = '44px'; dot.style.height = '44px'; dot.onclick = (e) => { e.stopPropagation(); updateSelectionProperty({ color: cw }); }; colorGroup.appendChild(dot);
                        });
                        toolbar.appendChild(colorGroup);
                        const sep = document.createElement('div'); sep.className = 'w-px h-10 bg-gray-200 mx-2'; toolbar.appendChild(sep);
                        const del = document.createElement('button'); del.innerHTML = ICO.trash; del.className = 'px-3 text-red-500 hover:bg-red-50 rounded text-4xl'; del.onclick = (e) => { e.stopPropagation(); deleteSelection(); };
                        toolbar.appendChild(del);

                        canvas.appendChild(toolbar);
                    }

                    interact(svg).draggable({
                        ignoreFrom: '.toolbar-btn',
                        listeners: {
                            start() { pushHistory(); },
                            move(event) {
                                const rad = -(STATE.rotation * Math.PI) / 180;
                                const dx = (event.dx * Math.cos(rad) - event.dy * Math.sin(rad)) / STATE.scale;
                                const dy = (event.dx * Math.sin(rad) + event.dy * Math.cos(rad)) / STATE.scale;
                                item.x += dx; item.y += dy; render2D();
                            },

                            }
                        }
                    });

                    return;
                }

                const el = document.createElement('div'); el.id = 'item-' + item.id;
                const isRound = def.type === 'round';
                const isStructureItem = def.type === 'structure' && !!def.tentType;
                const isFurniture = item.name.includes('modern-lounge');

        function __tmGetTentSubfloorTexture() {
            if (__TM_TENT_SUBFLOOR_TEX) return __TM_TENT_SUBFLOOR_TEX;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256; // 1x
                canvas.height = 512; // 2x (1ft x 2ft tile ratio)
                const ctx = canvas.getContext('2d');

                if (ctx) {
                    // Base grey
                    ctx.fillStyle = '#9ca3af';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Tile border lines (top + left so the repeat makes a grid)
                    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(canvas.width, 0);
                    ctx.moveTo(0, 0); ctx.lineTo(0, canvas.height);
                    ctx.stroke();

                    // 8 dots per 1x2 tile: 2 columns x 4 rows
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    const dotR = 14;
                    const xs = [canvas.width * 0.25, canvas.width * 0.75];
                    const ys = [canvas.height * 0.2, canvas.height * 0.4, canvas.height * 0.6, canvas.height * 0.8];
                    xs.forEach(x => ys.forEach(y => {
                        ctx.beginPath();
                        ctx.arc(x, y, dotR, 0, Math.PI * 2);
                        ctx.fill();
                    }));

                    // Soft highlight
                    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    g.addColorStop(0, 'rgba(255,255,255,0.10)');
                    g.addColorStop(1, 'rgba(0,0,0,0.06)');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.encoding = THREE.sRGBEncoding;
                tex.anisotropy = TEX_ANISO;
                tex.needsUpdate = true;
                __TM_TENT_SUBFLOOR_TEX = tex;
                return tex;
            } catch (e) {
                return null;
            }
        }

            hostedLoader.crossOrigin = 'anonymous';

            // --- Dance floor texture (requested for embed) -----------------
            const DANCE_FLOOR_TEX_URL = tmAssetUrl('Dark Maple Dance Floor Texture.JPG');
            if (!__TM_DANCE_FLOOR_TEX) {
                hostedLoader.load(

                    },

            // --- Red carpet texture (matches inside-mode carpet floor) ------
            const RED_CARPET_TEX_URL = tmAssetUrl('redcarpet-texture.png');
            if (!__TM_RED_CARPET_TEX) {
                hostedLoader.load(
                    RED_CARPET_TEX_URL,
                    (tex) => {
                        tex.encoding = THREE.sRGBEncoding;
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.wrapT = THREE.RepeatWrapping;
                        __TM_RED_CARPET_TEX = tex;

                        // Upgrade any already-rendered red carpets.
                        try {
                            if (scene) {
                                scene.traverse((n) => {
                                    if (n && n.isMesh && n.userData && n.userData.isRedCarpetMesh && n.material) {
                                        const w = n.userData.carpetW || 6;
                                        const h = n.userData.carpetH || 6;
                                        const map = __TM_RED_CARPET_TEX.clone();
                                        map.needsUpdate = true;
                                        map.repeat.set(Math.max(1, w / 10), Math.max(1, h / 10));

                                        n.material.roughness = 0.95;
                                        n.material.metalness = 0.0;
                                        n.material.needsUpdate = true;
                                    }
                                });
