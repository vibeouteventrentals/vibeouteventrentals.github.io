                        } catch (e) {}
                    },
                    undefined,
                    () => {}
                );
            }

            let skyColor = 0x87CEEB;
            if (MODE === 'inside') {
                skyColor = 0xd1d5db;
                scene.fog = null;
            } else {
                skyColor = STATE.isNightMode ? 0x020617 : 0x87CEEB;
                // Larger fog range to support the horizon ring / sky dome.
                scene.fog = new THREE.Fog(skyColor, 500, 9000);
            }

            scene.background = new THREE.Color(skyColor);

            // Sync the container background to the ground color so no blue leaks below terrain
            const groundBgColors = { grass: '#2d4a1e', gravel: '#6b6b6b', concrete: '#8a8a8a', sand: '#c2a96e', dirt: '#6b4e30', asphalt: '#3a3a3a', parking_lot: '#4a4a4a' };
            const gKey = STATE.outsideGround || 'grass';
            threeContainer.style.background = MODE === 'inside' ? '#d1d5db' : (STATE.isNightMode ? '#020617' : (groundBgColors[gKey] || '#2d4a1e'));

            // Outside sky + horizon ring (day mode)
            if (MODE === 'outside' && !STATE.isNightMode) {
                hostedLoader.load(SKY_URL, (tex) => {
                    tex.encoding = THREE.sRGBEncoding;
                    tex.minFilter = THREE.LinearMipMapLinearFilter;
                    tex.magFilter = THREE.LinearFilter;
                    tex.anisotropy = TEX_ANISO;
                    tex.needsUpdate = true;
                    const domeGeo = new THREE.SphereGeometry(6000, 64, 32);
                    const domeMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false });
                    const dome = new THREE.Mesh(domeGeo, domeMat);
                    dome.name = 'skyDomeEquirect';
                    dome.raycast = () => {};
                    dome.rotation.set(SKY_PITCH_RAD, SKY_YAW_RAD, 0);
                    dome.renderOrder = -20;
                    scene.add(dome);
                }, undefined, () => {});

                hostedLoader.load(HORIZON_RING_URL, (ringMap) => {
                    ringMap.encoding = THREE.sRGBEncoding;
                    ringMap.minFilter = THREE.LinearMipMapLinearFilter;
                    ringMap.magFilter = THREE.LinearFilter;
                    ringMap.anisotropy = TEX_ANISO;
                    ringMap.needsUpdate = true;
                    ringMap.wrapS = THREE.RepeatWrapping;
                    ringMap.wrapT = THREE.ClampToEdgeWrapping;
                    // Match the main app's horizon ring mapping (avoids a visible blue band at the base).
                    ringMap.repeat.set(_hCfg.repeatX, _hCfg.repeatY);
                    ringMap.offset.set(0, 0);

                    const RING_RADIUS = 2600;
                    const RING_HEIGHT = 300;
                    const ringGeo = new THREE.CylinderGeometry(RING_RADIUS, RING_RADIUS, RING_HEIGHT, 120, 1, true);
                    const ringMat = new THREE.MeshBasicMaterial({
                        map: ringMap,
                        side: THREE.BackSide,
                        transparent: true,
                        alphaTest: 0.001,
                        depthWrite: false,
                        fog: false
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.name = 'horizonRingPark';
                    ring.raycast = () => {};
                    const baseY = (RING_HEIGHT / 2) - 6;
                    ring.position.y = baseY;
                    ring.userData.baseY = baseY;
                    ring.renderOrder = -10;
                    scene.add(ring);
                }, undefined, () => {});
            }

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 12000); camera.rotation.order = 'YXZ';
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !IS_MOBILE, logarithmicDepthBuffer: !IS_IOS, powerPreference: IS_IOS ? 'low-power' : 'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_DPR));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.physicallyCorrectLights = true;
            renderer.shadowMap.enabled = ENABLE_SHADOWS; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            threeContainer.appendChild(renderer.domElement);
            try { THREE.Cache.enabled = true; } catch (e) {}
            try {
                renderer.domElement.addEventListener('webglcontextlost', function(ev) { try { ev.preventDefault(); cancelAnimationFrame(animationFrame); } catch (e) {} }, false);
                renderer.domElement.addEventListener('webglcontextrestored', function() { try { init3D(true); } catch (e) {} }, false);
            } catch (e) {}
            
            const ambIntensity = (STATE.isNightMode && MODE === 'outside') ? 0.15 : 0.7;
            scene.add(new THREE.AmbientLight(0xffffff, ambIntensity));
            
            const sunIntensity = (STATE.isNightMode && MODE === 'outside') ? 0.3 : 1.5;
            const sun = new THREE.DirectionalLight(0xffffff, sunIntensity); 
            sun.position.set(50, 100, 50); sun.castShadow = ENABLE_SHADOWS; sun.shadow.mapSize.width = IS_MOBILE ? 1024 : 4096; sun.shadow.mapSize.height = IS_MOBILE ? 1024 : 4096; sun.shadow.bias = -0.002; sun.shadow.normalBias = 0.15;
            scene.add(sun);
            // Texture caches (avoid regenerating heavy canvases)
            const textures = {};
            const sidewallPbr = {};

            const getSidewallPbr = (type) => {
                if (sidewallPbr[type]) return sidewallPbr[type];

                const parts = String(type || '').split('_');
                const sp = Math.max(1, parseInt(parts[1] || '10', 10) || 10);
                const variant = String(parts[2] || 'win').toLowerCase();
                const isWindow = variant !== 'solid';

                // Sidewalls in the app are modeled as ~8' tall planes.
                const WALL_H_FT = 8;
                const COLOR_SIZE = 1024;
                const PBR_SIZE = 512;

                const colorCanvas = document.createElement('canvas');
                colorCanvas.width = COLOR_SIZE;
                colorCanvas.height = COLOR_SIZE;
                const cctx = colorCanvas.getContext('2d');

                const roughCanvas = document.createElement('canvas');
                roughCanvas.width = PBR_SIZE;
                roughCanvas.height = PBR_SIZE;
                const rctx = roughCanvas.getContext('2d');

                const heightCanvas = document.createElement('canvas');
                heightCanvas.width = PBR_SIZE;
                heightCanvas.height = PBR_SIZE;
                const hctx = heightCanvas.getContext('2d');

                const fx = (ft, size) => (ft / sp) * size;
                const fy = (ft, size) => (ft / WALL_H_FT) * size;

                const drawStitchLine = (ctx, xPx, size, alpha) => {
                    ctx.save();
                    ctx.fillStyle = 'rgba(15,23,42,' + alpha + ')';
                    const dotH = Math.max(2, Math.round(fy(0.06, size)));
                    const dotW = Math.max(1, Math.round(dotH * 0.35));
                    const step = Math.max(dotH + 2, Math.round(fy(0.22, size)));
                    for (let y = Math.round(fy(0.15, size)); y < size; y += step) {
                        ctx.fillRect(xPx - dotW / 2, y, dotW, dotH);
                    }
                    ctx.restore();
                };

                const drawSeamColor = (xFt) => {
                    const x = fx(xFt, COLOR_SIZE);
                    const sw = Math.max(2, fx(0.20, COLOR_SIZE));
                    const g = cctx.createLinearGradient(x - sw, 0, x + sw, 0);
                    g.addColorStop(0, 'rgba(15,23,42,0.00)');
                    g.addColorStop(0.35, 'rgba(15,23,42,0.08)');
                    g.addColorStop(0.5, 'rgba(255,255,255,0.18)');
                    g.addColorStop(0.65, 'rgba(15,23,42,0.10)');
                    g.addColorStop(1, 'rgba(15,23,42,0.00)');
                    cctx.fillStyle = g;
                    cctx.fillRect(x - sw, 0, sw * 2, COLOR_SIZE);

                    const off = fx(0.08, COLOR_SIZE);
                    drawStitchLine(cctx, x - off, COLOR_SIZE, 0.22);
                    drawStitchLine(cctx, x + off, COLOR_SIZE, 0.22);
                };

                const drawSeamHeight = (xFt) => {
                    const x = fx(xFt, PBR_SIZE);
                    const sw = Math.max(2, fx(0.18, PBR_SIZE));
                    const g = hctx.createLinearGradient(x - sw, 0, x + sw, 0);
                    g.addColorStop(0, 'rgb(124,124,124)');
                    g.addColorStop(0.5, 'rgb(168,168,168)');
                    g.addColorStop(1, 'rgb(124,124,124)');
                    hctx.fillStyle = g;
                    hctx.fillRect(x - sw, 0, sw * 2, PBR_SIZE);

                    const off = fx(0.08, PBR_SIZE);
                    const lw = Math.max(1, Math.round(fx(0.02, PBR_SIZE)));
                    hctx.fillStyle = 'rgb(160,160,160)';
                    hctx.fillRect(Math.round(x - off - lw / 2), 0, lw, PBR_SIZE);
                    hctx.fillRect(Math.round(x + off - lw / 2), 0, lw, PBR_SIZE);
                };

                const drawWrinkles = () => {
                    // Big, soft vinyl tension lines (avoid "curtain" striping)
                    const drawCrease = (isHighlight) => {
                        const x0 = Math.random() * COLOR_SIZE;
                        const drift = (Math.random() - 0.5) * COLOR_SIZE * 0.22;
                        const x1 = x0 + drift;
                        const x2 = x0 - drift;
                        const x3 = x0 + (Math.random() - 0.5) * COLOR_SIZE * 0.18;

                        cctx.save();
                        cctx.lineCap = 'round';
                        cctx.lineJoin = 'round';
                        cctx.shadowBlur = 18;
                        cctx.shadowColor = isHighlight ? 'rgba(255,255,255,0.10)' : 'rgba(15,23,42,0.08)';
                        cctx.strokeStyle = isHighlight ? 'rgba(255,255,255,0.05)' : 'rgba(15,23,42,0.035)';
                        cctx.lineWidth = 10 + Math.random() * 22;
                        cctx.beginPath();
                        cctx.moveTo(x0, -40);
                        cctx.bezierCurveTo(x1, COLOR_SIZE * 0.33, x2, COLOR_SIZE * 0.66, x3, COLOR_SIZE + 40);
                        cctx.stroke();
                        cctx.restore();
                    };

                    // Subtle mottling so the wall isn't perfectly flat
                    cctx.save();
                    cctx.globalAlpha = 0.06;
                    for (let i = 0; i < 2200; i++) {
                        const x = Math.random() * COLOR_SIZE;
                        const y = Math.random() * COLOR_SIZE;
                        const s = 1 + Math.random() * 2;
                        cctx.fillStyle = Math.random() < 0.5 ? 'rgba(15,23,42,0.15)' : 'rgba(255,255,255,0.18)';
                        cctx.fillRect(x, y, s, s);
                    }
                    cctx.restore();

                    const creaseCount = 18;
                    for (let i = 0; i < creaseCount; i++) drawCrease(false);
                    for (let i = 0; i < Math.round(creaseCount * 0.45); i++) drawCrease(true);

                    // Height wrinkles (very subtle — just enough to catch light)
                    hctx.save();
                    hctx.globalAlpha = 0.22;
                    hctx.lineCap = 'round';
                    hctx.lineJoin = 'round';
                    hctx.strokeStyle = 'rgb(138,138,138)';
                    for (let i = 0; i < 12; i++) {
                        const x0 = Math.random() * PBR_SIZE;
                        const drift = (Math.random() - 0.5) * PBR_SIZE * 0.22;
                        const x1 = x0 + drift;
                        const x2 = x0 - drift;
                        const x3 = x0 + (Math.random() - 0.5) * PBR_SIZE * 0.18;
                        hctx.lineWidth = 5 + Math.random() * 10;
                        hctx.beginPath();
                        hctx.moveTo(x0, -20);
                        hctx.bezierCurveTo(x1, PBR_SIZE * 0.33, x2, PBR_SIZE * 0.66, x3, PBR_SIZE + 20);
                        hctx.stroke();
                    }
                    hctx.restore();
                };

                const drawWindow = (centerFt) => {
                    // Cathedral window sized/positioned like the reference (leave room under the eave)
                    const winW = 4.0;
                    const r = winW / 2;
                    const topMargin = 1.5;
                    const bottomMargin = 0.9;
                    const totalH = WALL_H_FT - topMargin - bottomMargin;
                    const rectH = Math.max(2.8, totalH - r);
                    const topY = topMargin;

                    const cy = topY + r;
                    const rectBottom = cy + rectH;
                    const midY = cy + rectH * 0.5;

                    const cxFt = centerFt;
                    const xL = cxFt - winW / 2;
                    const xR = cxFt + winW / 2;

                    // --- COLOR (transparent window you can actually see through) ---
                    const cX = fx(cxFt, COLOR_SIZE);
                    const cY = fy(cy, COLOR_SIZE);
                    const rx = fx(r, COLOR_SIZE);
                    const ry = fy(r, COLOR_SIZE);
                    const yTop = fy(topY, COLOR_SIZE);
                    const yBottom = fy(rectBottom, COLOR_SIZE);
                    const yMid = fy(midY, COLOR_SIZE);
                    const xLPx = fx(xL, COLOR_SIZE);
                    const xRPx = fx(xR, COLOR_SIZE);

                    const buildPath = () => {
                        cctx.beginPath();
                        if (cctx.ellipse) cctx.ellipse(cX, cY, rx, ry, 0, Math.PI, 0);
                        else {
                            cctx.save();
                            cctx.translate(cX, cY);
                            cctx.scale(1, ry / rx);
                            cctx.arc(0, 0, rx, Math.PI, 0);
                            cctx.restore();
                        }
                        cctx.lineTo(xRPx, yBottom);
                        cctx.lineTo(xLPx, yBottom);
                        cctx.closePath();
                    };

                    // 1) Punch the hole (alpha)
                    cctx.save();
                    buildPath();
                    cctx.clip();
                    cctx.globalCompositeOperation = 'destination-out';
                    cctx.fillStyle = 'rgba(0,0,0,1)';
                    cctx.fillRect(xLPx - 4, yTop - 4, (xRPx - xLPx) + 8, (yBottom - yTop) + 8);
                    cctx.restore();

                    // 2) Very light plastic tint + reflection (still see-through)
                    cctx.save();
                    buildPath();
                    cctx.clip();

                    const glassG = cctx.createLinearGradient(xLPx, yTop, xRPx, yBottom);
                    glassG.addColorStop(0, 'rgba(205,235,255,0.06)');
                    glassG.addColorStop(0.5, 'rgba(205,235,255,0.03)');
                    glassG.addColorStop(1, 'rgba(205,235,255,0.07)');
                    cctx.fillStyle = glassG;
                    cctx.fillRect(xLPx, yTop, xRPx - xLPx, yBottom - yTop);

                    // Reflection streak
                    cctx.save();
                    cctx.globalAlpha = 0.18;
                    cctx.translate(cX, yTop + (yBottom - yTop) * 0.55);
                    cctx.rotate(-0.35);
                    const rg = cctx.createLinearGradient(-rx, 0, rx, 0);
                    rg.addColorStop(0, 'rgba(255,255,255,0)');
                    rg.addColorStop(0.45, 'rgba(255,255,255,0.25)');
                    rg.addColorStop(0.55, 'rgba(255,255,255,0.25)');
                    rg.addColorStop(1, 'rgba(255,255,255,0)');
                    cctx.fillStyle = rg;
                    cctx.fillRect(-rx * 1.4, -(yBottom - yTop) * 0.8, rx * 2.8, (yBottom - yTop) * 1.6);
                    cctx.restore();

                    cctx.restore();

                    // 3) Frame + mullions (match reference)
                    const frameW = Math.max(4, fx(0.12, COLOR_SIZE));
                    const mullW = Math.max(3, fx(0.09, COLOR_SIZE));
                    cctx.strokeStyle = 'rgba(226,232,240,0.95)';

                    // Outer frame
                    cctx.lineWidth = frameW;
                    buildPath();
                    cctx.stroke();

                    const yBase = fy(cy, COLOR_SIZE);
                    cctx.lineWidth = mullW;

                    // Base-of-arch horizontal
                    cctx.beginPath();
                    cctx.moveTo(xLPx, yBase);
                    cctx.lineTo(xRPx, yBase);
                    cctx.stroke();

                    // Mid horizontal
                    cctx.beginPath();
                    cctx.moveTo(xLPx, yMid);
                    cctx.lineTo(xRPx, yMid);
                    cctx.stroke();

                    // Center vertical (rectangle only)
                    cctx.beginPath();
                    cctx.moveTo(cX, yBase);
                    cctx.lineTo(cX, yBottom);
                    cctx.stroke();

                    // Arch V mullions
                    const delta = 0.85;
                    const thetaL = (3 * Math.PI) / 2 - delta;
                    const thetaR = (3 * Math.PI) / 2 + delta;
                    const lx = cX + rx * Math.cos(thetaL);
                    const ly = cY + ry * Math.sin(thetaL);
                    const rxp = cX + rx * Math.cos(thetaR);
                    const ryp = cY + ry * Math.sin(thetaR);

                    cctx.beginPath(); cctx.moveTo(cX, yBase); cctx.lineTo(lx, ly); cctx.stroke();
                    cctx.beginPath(); cctx.moveTo(cX, yBase); cctx.lineTo(rxp, ryp); cctx.stroke();

                    // --- ROUGHNESS (window plastic glossier) ---
                    rctx.save();
                    rctx.beginPath();
                    const cXr = fx(cxFt, PBR_SIZE);
                    const cYr = fy(cy, PBR_SIZE);
                    const rxr = fx(r, PBR_SIZE);
                    const ryr = fy(r, PBR_SIZE);
                    if (rctx.ellipse) rctx.ellipse(cXr, cYr, rxr, ryr, 0, Math.PI, 0);
                    else {
                        rctx.save(); rctx.translate(cXr, cYr); rctx.scale(1, ryr / rxr); rctx.arc(0, 0, rxr, Math.PI, 0); rctx.restore();
                    }
                    rctx.lineTo(fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rctx.lineTo(fx(xL, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rctx.closePath();
                    rctx.clip();

                    const rg2 = rctx.createLinearGradient(fx(xL, PBR_SIZE), fy(topY, PBR_SIZE), fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    rg2.addColorStop(0, 'rgb(60,60,60)');
                    rg2.addColorStop(1, 'rgb(90,90,90)');
                    rctx.fillStyle = rg2;
                    rctx.fillRect(fx(xL, PBR_SIZE), fy(topY, PBR_SIZE), fx(winW, PBR_SIZE), fy(rectH + r, PBR_SIZE));
                    rctx.restore();

                    // --- HEIGHT (raise frame/mullions slightly) ---
                    hctx.save();
                    hctx.strokeStyle = 'rgb(166,166,166)';
                    hctx.lineWidth = Math.max(2, fx(0.10, PBR_SIZE));
                    hctx.beginPath();
                    const cXh = fx(cxFt, PBR_SIZE);
                    const cYh = fy(cy, PBR_SIZE);
                    const rxh = fx(r, PBR_SIZE);
                    const ryh = fy(r, PBR_SIZE);
                    if (hctx.ellipse) hctx.ellipse(cXh, cYh, rxh, ryh, 0, Math.PI, 0);
                    else {
                        hctx.save(); hctx.translate(cXh, cYh); hctx.scale(1, ryh / rxh); hctx.arc(0, 0, rxh, Math.PI, 0); hctx.restore();
                    }
                    hctx.lineTo(fx(xR, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    hctx.lineTo(fx(xL, PBR_SIZE), fy(rectBottom, PBR_SIZE));
                    hctx.closePath();
                    hctx.stroke();

                    hctx.lineWidth = Math.max(1, fx(0.06, PBR_SIZE));
                    const yBaseH = fy(cy, PBR_SIZE);
                    const yMidH = fy(midY, PBR_SIZE);
                    const yBottomH = fy(rectBottom, PBR_SIZE);

                    hctx.beginPath(); hctx.moveTo(fx(xL, PBR_SIZE), yBaseH); hctx.lineTo(fx(xR, PBR_SIZE), yBaseH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(fx(xL, PBR_SIZE), yMidH); hctx.lineTo(fx(xR, PBR_SIZE), yMidH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(cXh, yBottomH); hctx.stroke();

                    const lxH = cXh + rxh * Math.cos(thetaL);
                    const lyH = cYh + ryh * Math.sin(thetaL);
                    const rxHH = cXh + rxh * Math.cos(thetaR);
                    const ryHH = cYh + ryh * Math.sin(thetaR);
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(lxH, lyH); hctx.stroke();
                    hctx.beginPath(); hctx.moveTo(cXh, yBaseH); hctx.lineTo(rxHH, ryHH); hctx.stroke();
                    hctx.restore();
                };

                // --- COLOR MAP ---
                const baseGrad = cctx.createLinearGradient(0, 0, 0, COLOR_SIZE);
                baseGrad.addColorStop(0, '#f6f7f9');
                baseGrad.addColorStop(0.45, '#ffffff');
                baseGrad.addColorStop(1, '#f1f5f9');
                cctx.fillStyle = baseGrad;
                cctx.fillRect(0, 0, COLOR_SIZE, COLOR_SIZE);

                // Bottom scuff
                const scuff = cctx.createLinearGradient(0, fy(5.8, COLOR_SIZE), 0, COLOR_SIZE);
                scuff.addColorStop(0, 'rgba(15,23,42,0)');
                scuff.addColorStop(1, 'rgba(15,23,42,0.05)');
                cctx.fillStyle = scuff;
                cctx.fillRect(0, 0, COLOR_SIZE, COLOR_SIZE);

                // Edge reinforcements
                const edgeW = Math.max(2, fx(0.3, COLOR_SIZE));
                cctx.fillStyle = 'rgba(15,23,42,0.035)';
                cctx.fillRect(0, 0, edgeW, COLOR_SIZE);
                cctx.fillRect(COLOR_SIZE - edgeW, 0, edgeW, COLOR_SIZE);

                // Top and bottom hems
                const topHem = Math.max(2, Math.round(fy(0.35, COLOR_SIZE)));
                const bottomHem = Math.max(2, Math.round(fy(0.45, COLOR_SIZE)));

                const topG = cctx.createLinearGradient(0, 0, 0, topHem);
                topG.addColorStop(0, 'rgba(15,23,42,0.08)');
                topG.addColorStop(0.7, 'rgba(15,23,42,0.03)');
                topG.addColorStop(1, 'rgba(255,255,255,0.10)');
                cctx.fillStyle = topG;
                cctx.fillRect(0, 0, COLOR_SIZE, topHem);

                const bStart = COLOR_SIZE - bottomHem;
                const botG = cctx.createLinearGradient(0, bStart, 0, COLOR_SIZE);
                botG.addColorStop(0, 'rgba(255,255,255,0.10)');
                botG.addColorStop(0.35, 'rgba(15,23,42,0.03)');
                botG.addColorStop(1, 'rgba(15,23,42,0.10)');
                cctx.fillStyle = botG;
                cctx.fillRect(0, bStart, COLOR_SIZE, bottomHem);

                // --- PBR BASES ---
                // Roughness (higher = more matte)
                rctx.fillStyle = 'rgb(190,190,190)';
                rctx.fillRect(0, 0, PBR_SIZE, PBR_SIZE);

                // Height base
                hctx.fillStyle = 'rgb(128,128,128)';
                hctx.fillRect(0, 0, PBR_SIZE, PBR_SIZE);

                // Hems in height map
                const topHemH = Math.max(1, Math.round(fy(0.35, PBR_SIZE)));
                const botHemH = Math.max(1, Math.round(fy(0.45, PBR_SIZE)));

                const hTopG = hctx.createLinearGradient(0, 0, 0, topHemH);
                hTopG.addColorStop(0, 'rgb(120,120,120)');
                hTopG.addColorStop(0.5, 'rgb(155,155,155)');
                hTopG.addColorStop(1, 'rgb(128,128,128)');
                hctx.fillStyle = hTopG;
                hctx.fillRect(0, 0, PBR_SIZE, topHemH);

                const hbStart = PBR_SIZE - botHemH;
                const hBotG = hctx.createLinearGradient(0, hbStart, 0, PBR_SIZE);
                hBotG.addColorStop(0, 'rgb(128,128,128)');
                hBotG.addColorStop(0.5, 'rgb(158,158,158)');
                hBotG.addColorStop(1, 'rgb(118,118,118)');
                hctx.fillStyle = hBotG;
                hctx.fillRect(0, hbStart, PBR_SIZE, botHemH);

                // Center seam on 20' panels
                if (sp >= 18) {
                    drawSeamColor(sp / 2);
                    drawSeamHeight(sp / 2);

                    const sx = fx(sp / 2, PBR_SIZE);
                    const sw = Math.max(1, fx(0.22, PBR_SIZE));
                    rctx.fillStyle = 'rgb(205,205,205)';
                    rctx.fillRect(sx - sw, 0, sw * 2, PBR_SIZE);
                }

                // Wrinkles/noise
                // drawWrinkles(); // Disabled: the procedural wrinkle pass caused visible wavy artifacts on sidewalls.

                // Windows
                if (isWindow) {
                    if (sp >= 18) { drawWindow(sp * 0.30); drawWindow(sp * 0.70); }
                    else drawWindow(sp * 0.50);
                }

                // Roughness micro-noise
                const roughImg = rctx.getImageData(0, 0, PBR_SIZE, PBR_SIZE);
                for (let i = 0; i < roughImg.data.length; i += 4) {
                    const n = (Math.random() - 0.5) * 10;
                    const v = Math.max(0, Math.min(255, roughImg.data[i] + n));
                    roughImg.data[i] = v;
                    roughImg.data[i + 1] = v;
                    roughImg.data[i + 2] = v;
                    roughImg.data[i + 3] = 255;
                }
                rctx.putImageData(roughImg, 0, 0);

                // --- NORMAL MAP (from height) ---
                const heightData = hctx.getImageData(0, 0, PBR_SIZE, PBR_SIZE);
                const hD = heightData.data;

                const normalCanvas = document.createElement('canvas');
                normalCanvas.width = PBR_SIZE;
                normalCanvas.height = PBR_SIZE;
                const nctx = normalCanvas.getContext('2d');

                const normalImg = nctx.createImageData(PBR_SIZE, PBR_SIZE);
                const nD = normalImg.data;

                const strength = 1.6;
                const idx = (x, y) => (y * PBR_SIZE + x) * 4;
                const getH = (x, y) => {
                    const xi = Math.max(0, Math.min(PBR_SIZE - 1, x));
                    const yi = Math.max(0, Math.min(PBR_SIZE - 1, y));
                    return hD[idx(xi, yi)] / 255;
                };

                for (let y = 0; y < PBR_SIZE; y++) {
                    for (let x = 0; x < PBR_SIZE; x++) {
                        const hL = getH(x - 1, y);
                        const hR = getH(x + 1, y);
                        const hU = getH(x, y - 1);
                        const hDwn = getH(x, y + 1);
                        const dx = (hR - hL) * strength;
                        const dy = (hDwn - hU) * strength;
                        let nx = -dx;
                        let ny = -dy;
                        let nz = 1.0;
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1.0;
                        nx /= len; ny /= len; nz /= len;
                        const o = idx(x, y);
                        nD[o] = Math.round((nx * 0.5 + 0.5) * 255);
                        nD[o + 1] = Math.round((ny * 0.5 + 0.5) * 255);
                        nD[o + 2] = Math.round((nz * 0.5 + 0.5) * 255);
                        nD[o + 3] = 255;
                    }
                }
                nctx.putImageData(normalImg, 0, 0);

                const map = new THREE.CanvasTexture(colorCanvas);
                map.wrapS = map.wrapT = THREE.ClampToEdgeWrapping;
                if (map.colorSpace !== undefined && THREE.SRGBColorSpace) map.colorSpace = THREE.SRGBColorSpace;
                else if (map.encoding !== undefined && THREE.sRGBEncoding) map.encoding = THREE.sRGBEncoding;

                const roughnessMap = new THREE.CanvasTexture(roughCanvas);
                roughnessMap.wrapS = roughnessMap.wrapT = THREE.ClampToEdgeWrapping;

                const normalMap = new THREE.CanvasTexture(normalCanvas);
                normalMap.wrapS = normalMap.wrapT = THREE.ClampToEdgeWrapping;

                sidewallPbr[type] = { map: map, roughnessMap: roughnessMap, normalMap: normalMap };
                return sidewallPbr[type];
            };

            const makeSidewallMaterial = (texKey, isSolid) => {
                const pbr = getSidewallPbr(texKey);
                const m = new THREE.MeshStandardMaterial({
                    map: pbr.map,
                    roughnessMap: pbr.roughnessMap,
                    normalMap: pbr.normalMap,
                    roughness: 1.0,
                    metalness: 0.0,
                    side: THREE.DoubleSide,
                    transparent: !isSolid,
                    alphaTest: !isSolid ? 0.02 : 0
                });
                if (m.normalScale && m.normalScale.set) m.normalScale.set(0.35, 0.35);
                return m;
            };

            const getTex = (type) => {
                if (textures[type]) return textures[type];
                if (String(type || '').startsWith('sidewall_')) {
                    const pbr = getSidewallPbr(type);
                    textures[type] = pbr.map;
                    return pbr.map;
                }

                const c = document.createElement('canvas');
                c.width = 1024;
                c.height = 1024;
                const ctx = c.getContext('2d');

                if(type === 'grass') {
                    // DARK MOSSY GRASS (MATCHING MAIN APP)
                    const SIZE = 1024;
                    ctx.fillStyle = '#1a1812';
                    ctx.fillRect(0, 0, SIZE, SIZE);

                    const drawTileable = (drawFn) => {
                        [0, SIZE, -SIZE].forEach(ox => {
                            [0, SIZE, -SIZE].forEach(oy => {
                                drawFn(ox, oy);
                            });
                        });
                    };

                    for(let i=0; i<80000; i++) {
                        const x = Math.random() * SIZE;
                        const y = Math.random() * SIZE;
                        const w = 2 + Math.random() * 6;
                        const h = 2 + Math.random() * 6;
                        const rVal = Math.random();
                        if (rVal < 0.4) ctx.fillStyle = '#222b13';
                        else if (rVal < 0.7) ctx.fillStyle = '#2d381c';
                        else ctx.fillStyle = '#1e240f';
                        ctx.globalAlpha = 0.8;
                        ctx.fillRect(x, y, w, h);
                    }

                    ctx.globalAlpha = 0.4;
                    for(let i=0; i<25; i++) {
                        const cx = Math.random() * SIZE;
                        const cy = Math.random() * SIZE;
                        const r = 80 + Math.random() * 150;
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        g.addColorStop(0, '#3a4a25');
                        g.addColorStop(0.6, '#2d381c');
                        g.addColorStop(1, 'rgba(45, 56, 28, 0)');
                        drawTileable((ox, oy) => {
                            ctx.fillStyle = g;
                            ctx.translate(ox, oy);
                            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
                            ctx.translate(-ox, -oy);
                        });
                    }

                    ctx.globalAlpha = 0.25;
                    for(let i=0; i<40; i++) {
                        const cx = Math.random() * SIZE;
                        const cy = Math.random() * SIZE;
                        const r = 40 + Math.random() * 80;
                        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                        g.addColorStop(0, '#4a3b2a');
                        g.addColorStop(1, 'transparent');
                        drawTileable((ox, oy) => {
                            ctx.fillStyle = g;
                            ctx.translate(ox, oy);
                            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
                            ctx.translate(-ox, -oy);
                        });
                    }

                    ctx.globalAlpha = 0.7;
                    ctx.lineWidth = 1.0;
                    for(let i=0; i<150000; i++) {
                        const x = Math.random() * SIZE;
                        const y = Math.random() * SIZE;
                        const len = 3 + Math.random() * 4;
                        const ang = (Math.random() - 0.5) * 0.5 - (Math.PI/2);
                        const rVal = Math.random();
                        if (rVal < 0.6) ctx.strokeStyle = '#42542a';
                        else if (rVal < 0.9) ctx.strokeStyle = '#5c733a';
                        else ctx.strokeStyle = '#2b3618';
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + Math.cos(ang)*len, y + Math.sin(ang)*len);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 1024, 1024);
                }

                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                if(type==='grass') tex.repeat.set(80,80);
                textures[type] = tex;
                return tex;
            };

            // ── Pole Tent Ratchet / Stake-Bar Generator (inline for embed) ──
            const createPoleRatchetGroupEmbed = (tW, tD, wallH = 8, sidePoleHeight = 8, poleBaySpacingFt) => {
                const group = new THREE.Group();
                group.name = 'poleRatchets';
                const offset = sidePoleHeight >= 10 ? 9 : 7;
                const span = Math.min(tW, tD);
                const baySpacing = poleBaySpacingFt || (span <= 30 ? 15 : 10);
                const strapMat = new THREE.MeshStandardMaterial({ color: 0xe8e4d8, roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide });
                const ratchetHwMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
                const stakeBarMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.4, metalness: 0.6 });
                const stakeHeadMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.25, metalness: 0.8 });

                const addStrap = (topX, topY, topZ, botX, botY, botZ) => {
                    const top = new THREE.Vector3(topX, topY, topZ);
                    const bot = new THREE.Vector3(botX, botY, botZ);
                    const len = top.distanceTo(bot);
                    if (len < 0.1) return;
                    const sg = new THREE.PlaneGeometry(0.24, len);
                    const s = new THREE.Mesh(sg, strapMat);
                    const mid = top.clone().add(bot).multiplyScalar(0.5);
                    s.position.copy(mid);
                    const dir = bot.clone().sub(top).normalize();
                    const up = new THREE.Vector3(0, 1, 0);
                    const right = new THREE.Vector3().crossVectors(dir, up).normalize();
                    if (right.lengthSq() < 0.001) right.set(1, 0, 0);
                    const normal = new THREE.Vector3().crossVectors(right, dir).normalize();
                    const m4 = new THREE.Matrix4().makeBasis(right, dir, normal);
                    const q = new THREE.Quaternion().setFromRotationMatrix(m4);
                    s.quaternion.copy(q);
                    s.castShadow = true;
                    group.add(s);
                    const rp = top.clone().lerp(bot, 0.7);
                    const rg = new THREE.BoxGeometry(0.40, 0.24, 0.16);
                    const rm = new THREE.Mesh(rg, ratchetHwMat);
                    rm.position.copy(rp);
                    rm.quaternion.copy(q);
                    rm.castShadow = true;
                    group.add(rm);
                };

                const addStakeBar = (x, z, sdx, sdz) => {
                    const angle = Math.atan2(sdx, sdz);
                    const barLen = 2.5, barW = 0.35, barTh = 0.12;
                    const bg = new THREE.BoxGeometry(barLen, barTh, barW);
                    const b = new THREE.Mesh(bg, stakeBarMat);
                    b.position.set(x, barTh / 2, z);
                    b.rotation.y = angle;
                    b.castShadow = true; b.receiveShadow = true;
                    group.add(b);
                    const sinA = Math.sin(angle), cosA = Math.cos(angle);
                    [-barLen * 0.38, barLen * 0.38].forEach(off => {
                        const sx = x + off * cosA, sz = z - off * sinA;
                        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 8), stakeHeadMat);
                        shaft.position.set(sx, barTh + 0.125, sz);
                        shaft.castShadow = true;
                        group.add(shaft);
                        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.09, 12), stakeHeadMat);
                        cap.position.set(sx, barTh + 0.25 + 0.045, sz);
                        cap.castShadow = true;
                        group.add(cap);
                    });
                };

                // Collect perimeter poles
                const halfW = tW / 2, halfD = tD / 2;
                const poles = [];
                for (let x = 0; x <= tW + 0.01; x += baySpacing) {
                    const cx = Math.min(x, tW);
                    const isCorner = (cx < 0.01) || (cx > tW - 0.01);
                    poles.push({ x: cx - halfW, z: -halfD, nx: 0, nz: -1, isCorner });
                }
                for (let z = baySpacing; z < tD - 0.01; z += baySpacing) {
                    poles.push({ x: halfW, z: z - halfD, nx: 1, nz: 0, isCorner: false });
                }
                for (let x = tW; x >= -0.01; x -= baySpacing) {
                    const cx = Math.max(x, 0);
                    const isCorner = (cx < 0.01) || (cx > tW - 0.01);
                    if (isCorner) poles.push({ x: cx - halfW, z: halfD, nx: 0, nz: 1, isCorner: true });
                    else poles.push({ x: cx - halfW, z: halfD, nx: 0, nz: 1, isCorner: false });
                }
                for (let z = tD - baySpacing; z > 0.01; z -= baySpacing) {
                    poles.push({ x: -halfW, z: z - halfD, nx: -1, nz: 0, isCorner: false });
                }

                for (const p of poles) {
                    const plateY = wallH;
                    if (p.isCorner) {
                        const dirX = p.x < 0 ? -1 : 1, dirZ = p.z < 0 ? -1 : 1;
                        const targets = [
                            { dx: dirX * offset, dz: 0 },
                            { dx: dirX * offset * 0.707, dz: dirZ * offset * 0.707 },
                            { dx: 0, dz: dirZ * offset }
                        ];
                        for (const t of targets) {
                            const sx = p.x + t.dx, sz = p.z + t.dz;
                            addStrap(p.x, plateY, p.z, sx, 0.15, sz);
                            addStakeBar(sx, sz, t.dx, t.dz);
                        }
                    } else {
                        const sx = p.x + p.nx * offset, sz = p.z + p.nz * offset;
                        addStrap(p.x, plateY, p.z, sx, 0.15, sz);
                        addStakeBar(sx, sz, p.nx, p.nz);
                    }
                }
                return group;
            };

            const createTentMesh = (tW, tD, tT, forceRoof, poleLegHeightFt, poleCenterPoleHeightFt, hexSideLengthFt, customMarqueeConfig, overrideClearTop) => {
                const group = new THREE.Group();
                let peakH = 13, wallH = 8, swoop = 1.0; 
                if (tT === 'Pole') { peakH = 22; wallH = 8; swoop = 3.0; } else if (tT === 'Marquee') { peakH = 16.5; wallH = 8; swoop = 1.6; } else if (tT === 'CustomMarquee') { peakH = 20; wallH = 8; swoop = 2.0; } else if (tT === 'Hex') { peakH = 22; wallH = 8; swoop = 1.6; }
                if (tT === 'Pole') {
                    if (typeof poleLegHeightFt === 'number' && isFinite(poleLegHeightFt)) wallH = poleLegHeightFt;
                    if (typeof poleCenterPoleHeightFt === 'number' && isFinite(poleCenterPoleHeightFt)) peakH = poleCenterPoleHeightFt;
                }
                if (tT === 'CustomMarquee' && customMarqueeConfig) {
                    if (typeof customMarqueeConfig.sidePoleHeightFt === 'number' && isFinite(customMarqueeConfig.sidePoleHeightFt)) wallH = customMarqueeConfig.sidePoleHeightFt;
                    if (typeof customMarqueeConfig.centerPoleHeightFt === 'number' && isFinite(customMarqueeConfig.centerPoleHeightFt)) peakH = customMarqueeConfig.centerPoleHeightFt;
                }
                const pMat = new THREE.MeshStandardMaterial({ color: tT === 'Popup' ? 0xfcfcfc : (tT === 'Marquee' || tT === 'CustomMarquee' ? 0xefefef : 0xcccccc), metalness: 0.6, roughness: 0.2 }); 
                const vinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 1.0, metalness: 0.0 });
                const clearRoofMat = new THREE.MeshStandardMaterial({ color: 0xe6f3ff, side: THREE.DoubleSide, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0.35, depthWrite: false });
                var effectiveCT = typeof overrideClearTop === 'boolean' ? overrideClearTop : STATE.clearTop;
                const roofMat = effectiveCT ? clearRoofMat : vinMat;
                const cableMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

                // Custom Marquee: user-defined poles with swooping roof
                if (tT === 'CustomMarquee' && customMarqueeConfig) {
                    var shouldShowRoof = forceRoof || STATE.tentRoofVisible;
                    var spp = customMarqueeConfig.sidePolesPerSide || 6;
                    var cpN = customMarqueeConfig.centerPoles || 3;
                    for (var si = 0; si < spp; si++) {
                        var zP = spp > 1 ? (si / (spp - 1)) * tD : tD / 2;
                        var legL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, wallH, 16), pMat);
                        legL.position.set(-tW/2, wallH/2, zP - tD/2); legL.castShadow = true; group.add(legL);
                        var plL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), pMat);
                        plL.position.set(-tW/2, 0.025, zP - tD/2); group.add(plL);
                        var legR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, wallH, 16), pMat);
                        legR.position.set(tW/2, wallH/2, zP - tD/2); legR.castShadow = true; group.add(legR);
                        var plR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), pMat);
                        plR.position.set(tW/2, 0.025, zP - tD/2); group.add(plR);
                    }
                    var cmPeaks = [];
                    if (cpN === 1) {
                        var zC = tD / 2;
                        var cp = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, peakH - wallH, 12), pMat);
                        cp.position.set(0, wallH + (peakH - wallH)/2, zC - tD/2); cp.castShadow = true; group.add(cp);
                        cmPeaks.push({ x: tW/2, z: zC });
                        [[-tW/2, 0], [tW/2, 0], [-tW/2, tD], [tW/2, tD]].forEach(function(cArr) {
                            var st = new THREE.Vector3(cArr[0], wallH, cArr[1] - tD/2);
                            var en = new THREE.Vector3(0, wallH, zC - tD/2);
                            var d = st.distanceTo(en);
                            if (d > 0.5) { var cb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, d, 8), cableMat); cb.position.copy(new THREE.Vector3().addVectors(st, en).multiplyScalar(0.5)); cb.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), en.clone().sub(st).normalize()); group.add(cb); }
                        });
                    } else {
                        var cpSp = tD / (cpN + 1);
                        for (var ci = 0; ci < cpN; ci++) {
                            var zCi = (ci + 1) * cpSp;
                            var cpi = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, peakH - wallH, 12), pMat);
                            cpi.position.set(0, wallH + (peakH - wallH)/2, zCi - tD/2); cpi.castShadow = true; group.add(cpi);
                            cmPeaks.push({ x: tW/2, z: zCi });
                            var bS = ci === 0 ? 0 : (ci * cpSp + (ci - 1) * cpSp) / 2;
                            var bE = ci === cpN - 1 ? tD : ((ci + 1) * cpSp + (ci + 2) * cpSp) / 2;
                            [[-tW/2, bS], [tW/2, bS], [-tW/2, bE], [tW/2, bE]].forEach(function(cArr) {
                                var st = new THREE.Vector3(cArr[0], wallH, cArr[1] - tD/2);
                                var en = new THREE.Vector3(0, wallH, zCi - tD/2);
                                var d = st.distanceTo(en);
                                if (d > 0.5) { var cb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, d, 8), cableMat); cb.position.copy(new THREE.Vector3().addVectors(st, en).multiplyScalar(0.5)); cb.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), en.clone().sub(st).normalize()); group.add(cb); }
                            });
                        }
                    }
                    if (shouldShowRoof) {
                        var rGeo = new THREE.PlaneGeometry(tW, tD, Math.max(40, Math.floor(tW*2)), Math.max(40, Math.floor(tD*2)));
                        rGeo.rotateX(-Math.PI / 2); var rPos = rGeo.attributes.position;
                        for (var ri = 0; ri < rPos.count; ri++) {
                            var rvx = rPos.getX(ri) + tW/2, rvz = rPos.getZ(ri) + tD/2;
                            var rmD = Infinity; cmPeaks.forEach(function(p) { var dd = Math.sqrt((rvx - p.x)*(rvx - p.x) + (rvz - p.z)*(rvz - p.z)); if (dd < rmD) rmD = dd; });
                            var rdW = Math.min(rvx, tW - rvx, rvz, tD - rvz);
                            rPos.setY(ri, wallH + (peakH - wallH) * Math.pow(rdW / (rdW + rmD + 0.001), swoop));
                        }
                        rGeo.computeVertexNormals();
                        var roofM = new THREE.Mesh(rGeo, roofMat); roofM.castShadow = true; group.add(roofM);
                        var vhMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
                        var addVc = function(vw, px, pz, ry) {
                            var vi = new THREE.Mesh(new THREE.PlaneGeometry(vw, 1.0), vinMat); vi.position.set(px, wallH - 0.5, pz); vi.rotation.y = ry; group.add(vi);
                            var hm = new THREE.Mesh(new THREE.PlaneGeometry(vw, 0.05), vhMat); hm.position.set(px, wallH - 1.0 + 0.025, pz + (ry === 0 ? -0.01 : (ry === Math.PI ? 0.01 : 0))); if (ry === Math.PI/2 || ry === -Math.PI/2) hm.position.x += (ry === Math.PI/2 ? -0.01 : 0.01); hm.rotation.y = ry; group.add(hm);
                        };
                        addVc(tW, 0, -tD/2 - 0.05, 0); addVc(tW, 0, tD/2 + 0.05, Math.PI);
                        addVc(tD, -tW/2 - 0.05, 0, -Math.PI/2); addVc(tD, tW/2 + 0.05, 0, Math.PI/2);
                    }
                    return group;
                }

                // Frame structure tents: gable roof + portal frames (no interior poles)
                if (tT === 'Frame') {
                    // NOTE: this embed runs as a standalone HTML document.
                    // Use the embed's *tent* roof toggle.
                    // (Inside-mode uses STATE.showRoof for the *room ceiling*.)
                    const shouldShowRoof = (STATE.tentRoofVisible || forceRoof);

                    // Convention: tW = width, tD = depth.
                    // For frames we keep **width = span** and **depth = length** so the plan view matches the label (SPAN x LENGTH).
                    const span = tW;
                    const length = tD;

                    // Typical frame leg heights are 8' or 10'. Use a simple heuristic based on span.
                    const wallHcs = 8;

                    // Typical structure tents use an ~18° roof pitch.
                    const pitchDeg = 18;
                    const rise = (span / 2) * Math.tan((pitchDeg * Math.PI) / 180);

            const STAGE_GUARDRAIL_PANEL_FT = 4.0;

            const createStageGuardrails3D = (totalW, totalD, stageTopY, rails) => {
              const group = new THREE.Group();

              const railMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.22 });

              const postY = stageTopY + (STAGE_GUARDRAIL_HEIGHT_FT * 0.5);

              const segCountX = Math.max(1, Math.round(totalW / STAGE_GUARDRAIL_PANEL_FT));
              const segCountZ = Math.max(1, Math.round(totalD / STAGE_GUARDRAIL_PANEL_FT));
              const segLenX = totalW / segCountX;

                        const computeSegs = (len) => { const maxSeg = getWSp(STATE.tent.type, len); const count = Math.max(1, Math.ceil(len / maxSeg)); const segLen = len / count; return Array.from({ length: count }, (_, i) => ({ start: i * segLen, length: segLen })); };
                        const wSegs = computeSegs(STATE.tent.width);
                        const dSegs = computeSegs(STATE.tent.height);
                        STATE.tent.sidewalls.forEach(ws => { 
                            const seg = (ws.side==='top'||ws.side==='bottom') ? wSegs[ws.index] : dSegs[ws.index];
                            if (!seg) return;
                            const sp = seg.length; 
                            const isWindow = (ws.type !== 'solid');
                            // IMPORTANT: this code lives inside a template string (the embed HTML). Do NOT use backticks here.
                            const texKey = 'sidewall_' + Math.max(1, Math.round(sp)) + '_' + (isWindow ? 'win' : 'solid');
                            const wallMat = makeSidewallMaterial(texKey, !isWindow);
                            const wall = new THREE.Mesh(new THREE.PlaneGeometry(sp, wallH), wallMat); 
                            wall.position.y = wallH/2; 
                            if(ws.side==='top'){ wall.position.x = seg.start + sp/2; wall.position.z = 0.25; } 
                            else if(ws.side==='bottom'){ wall.position.x = seg.start + sp/2; wall.position.z = STATE.tent.height-0.25; wall.rotation.y=Math.PI; } 
                            else if(ws.side==='left'){ wall.position.z = seg.start + sp/2; wall.position.x = 0.25; wall.rotation.y=Math.PI/2; } 
                            else if(ws.side==='right'){ wall.position.z = seg.start + sp/2; wall.position.x = STATE.tent.width-0.25; wall.rotation.y=-Math.PI/2; } 
                            scene.add(wall); 
                        });
                    }
                }
                }
            } else {
                // Room (inside mode)
                // Use the hosted flooring textures so the embed matches the main 3D view.
                // Load textures ASYNC with hostedLoader (same pattern as outside ground + main ThreeDEditView).

                const floorColor = String(STATE.room.floorColor || '').trim().toLowerCase();
                let floorUrl = tmAssetUrl('Floor_Tile_Texture1.jpg'); // Patterned Tile (default)
                let repDiv = 10;
                if (floorColor === '#8b5a2b') {
                    floorUrl = tmAssetUrl('Hard_Wood_Floor_Texture.jpg');
                } else if (floorColor === '#ffffff') {
                    floorUrl = tmAssetUrl('Marble_Floor_Tile.jpg');
                } else if (floorColor === '#111111') {
                    floorUrl = tmAssetUrl('Black_Stone_Floor_Tile.jpg');
                } else if (floorColor === '#567d46') {
                    floorUrl = tmAssetUrl('grasstexture_orig.png');
                    repDiv = 5;
                } else if (floorColor === '#991b1b') {
                    floorUrl = tmAssetUrl('redcarpet-texture.png');
                }

                const floorRepX = Math.max(1, w / repDiv);
                const floorRepZ = Math.max(1, d / repDiv);

                // Start with fallback flat-color material
                const floorMat = new THREE.MeshStandardMaterial({
                    color: STATE.room.floorColor || 0x999999,
                    roughness: 0.9,
                    metalness: 0.0,
                });

                // Async-load the hosted floor texture and swap it in when ready
                hostedLoader.load(floorUrl, (map) => {
                    map.wrapS = THREE.RepeatWrapping;
                    map.wrapT = THREE.RepeatWrapping;
                    map.encoding = THREE.sRGBEncoding;
                    map.minFilter = THREE.LinearMipMapLinearFilter;
                    map.magFilter = THREE.LinearFilter;
                    map.anisotropy = TEX_ANISO;
                    map.repeat.set(floorRepX, floorRepZ);
                    map.needsUpdate = true;
                    floorMat.map = map;
                    floorMat.color.set(0xffffff);
                    floorMat.needsUpdate = true;
                }, undefined, () => { /* keep fallback color */ });

                const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat);
                floor.rotation.x = -Math.PI/2;
                floor.receiveShadow = true;
                floor.position.set(centerX, 0, centerZ);
                scene.add(floor);
                
                wallsGroup = new THREE.Group();
                const rH = 12;

                // Match main app wall-finish mapping
                let intTexType = 'simple_beige_wall';
                const _wc = (STATE.room.wallColor || '').toLowerCase();
                if (_wc === '#f8fafc') intTexType = 'molding_wall';
                else if (_wc === '#94a3b8') intTexType = 'gallery_wall';
                else if (_wc === '#d2b48c') intTexType = 'wood_panel_wall';
                else if (_wc === '#f5f5dc') intTexType = 'simple_beige_wall';

                let extTexType = 'stone_ext';
                const _ec = (STATE.room.exteriorWallColor || '').toLowerCase();
                if (_ec === '#e0c4a8') extTexType = 'brick_ext';
                else if (_ec === '#dbeafe') extTexType = 'siding_ext';
                else if (_ec === '#1f2937') extTexType = 'modern_ext';
                else extTexType = 'stone_ext';

                const getWallTexUrl = (t) => {
                  if (t === 'molding_wall') return __TM_WALL_WAINSCOT_URL;
                  if (t === 'brick_ext') return __TM_WALL_BRICK_URL;
                  if (t === 'stone_ext') return __TM_WALL_STONE_URL;
                  return null;
                };

                const makeWallMat = (url, fallbackColor, wallW) => {
                  const mat = new THREE.MeshStandardMaterial({ color: fallbackColor, roughness: 0.95, metalness: 0.0, side: THREE.FrontSide });
                  if (!url) return mat;
                  hostedLoader.load(url, (map) => {
                    map.wrapS = THREE.RepeatWrapping;
                    map.wrapT = THREE.RepeatWrapping;
                    map.encoding = THREE.sRGBEncoding;
                    map.repeat.set(wallW / 10, rH / 10);
                    map.anisotropy = TEX_ANISO;
                    map.needsUpdate = true;
                    mat.map = map;
                    mat.color.set(0xffffff);
                    mat.needsUpdate = true;
                  }, undefined, () => { /* keep fallback */ });
                  return mat;
                };

                const makeIntMat = (wallW) => makeWallMat(getWallTexUrl(intTexType), STATE.room.wallColor, wallW);
                const makeExtMat = (wallW) => makeWallMat(getWallTexUrl(extTexType), (STATE.room.exteriorWallColor || STATE.room.wallColor), wallW);

                const wallGeoW = new THREE.PlaneGeometry(w, rH);
                const wallGeoD = new THREE.PlaneGeometry(d, rH);

                // Back wall (z=0)
                const backInt = new THREE.Mesh(wallGeoW, makeIntMat(w));
                backInt.position.set(centerX, rH / 2, 0);
                backInt.rotation.y = 0;
                wallsGroup.add(backInt);
                const backExt = new THREE.Mesh(wallGeoW, makeExtMat(w));
                backExt.position.copy(backInt.position);
                backExt.rotation.y = Math.PI;
                wallsGroup.add(backExt);

                // Front wall (z=d)
                const frontInt = new THREE.Mesh(wallGeoW, makeIntMat(w));
                frontInt.position.set(centerX, rH / 2, d);
                frontInt.rotation.y = Math.PI;
                wallsGroup.add(frontInt);
                const frontExt = new THREE.Mesh(wallGeoW, makeExtMat(w));
                frontExt.position.copy(frontInt.position);
                frontExt.rotation.y = 0;
                wallsGroup.add(frontExt);

                // Left wall (x=0)
                const leftInt = new THREE.Mesh(wallGeoD, makeIntMat(d));
                leftInt.position.set(0, rH / 2, centerZ);
                leftInt.rotation.y = Math.PI / 2;
                wallsGroup.add(leftInt);
                const leftExt = new THREE.Mesh(wallGeoD, makeExtMat(d));
                leftExt.position.copy(leftInt.position);
                leftExt.rotation.y = -Math.PI / 2;
                wallsGroup.add(leftExt);

                // Right wall (x=w)
                const rightInt = new THREE.Mesh(wallGeoD, makeIntMat(d));
                rightInt.position.set(w, rH / 2, centerZ);
                rightInt.rotation.y = -Math.PI / 2;
                wallsGroup.add(rightInt);
                const rightExt = new THREE.Mesh(wallGeoD, makeExtMat(d));
                rightExt.position.copy(rightInt.position);
                rightExt.rotation.y = Math.PI / 2;
                wallsGroup.add(rightExt);

                const ceilMat = new THREE.MeshStandardMaterial({ color: STATE.room.ceilingColor || '#ffffff', roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide });
                const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), ceilMat);
                ceil.position.set(centerX, rH, centerZ);
                ceil.rotation.x = Math.PI/2;
                ceil.name = "ceiling";

                wallsGroup.visible = STATE.showWalls;
                ceil.visible = STATE.showRoof;

                scene.add(wallsGroup);
                scene.add(ceil);
            }

            const getStgH = (fx, fz) => {
              let max = 0;

              STATE.items.forEach((o) => {
                if (!o || !o.name || !String(o.name).startsWith('stage-')) return;
                const d = ITEM_DEFS[o.name];
                if (!d) return;

                const oW = o.width || d.width || d.diameter || 1;
                const oD = o.height || d.height || d.diameter || 1;

                // Stage is positioned by its top-left in 2D, but rotated around its center.
                const cx = (o.x / CELL_SIZE) - borderCells + (oW / 2);
                const cz = (o.y / CELL_SIZE) - borderCells + (oD / 2);

                const rot = -(((o.angle || 0) * Math.PI) / 180);
                const c = Math.cos(rot);
                const s = Math.sin(rot);

                const dx = fx - cx;
                const dz = fz - cz;

                // Transform world point into the stage's local (unrotated) space.
                const lx = dx * c - dz * s;
                const lz = dx * s + dz * c;

                if (Math.abs(lx) <= oW / 2 && Math.abs(lz) <= oD / 2) {
                  const h = parseInt(o.stageHeight || '24') / 12;
                  const elev = (typeof o.elevation === 'number') ? o.elevation : 0;
                  const top = elev + h;
                  if (top > max) max = top;
                }
              });

              return max;
            };

            // Inline pole tent roof clamper for string lights
            const _buildPoleTentRoofClamper = (tW, tD, sceneCX, sceneCZ, wallH, peakH) => {
              const _symPos = (length, maxSpan) => {
                if (length <= maxSpan + 1e-6) return [length / 2];
                const sections = Math.ceil(length / maxSpan);
                const bay = length / sections;
                const out = [];
                for (let i = 1; i < sections; i++) out.push(i * bay);
                return out;
              };
              const isLongZ = tD > tW;
              const longLen = Math.max(tW, tD);
              const span = Math.min(tW, tD);
              const pcms = span <= 30 ? 15 : 20;
              const longPos = _symPos(longLen, pcms);
              const rowPos = span <= 40 ? [span / 2] : _symPos(span, pcms);
              const peaks = [];
              if (isLongZ) { rowPos.forEach(x => longPos.forEach(z => peaks.push({ x, z }))); }
              else { longPos.forEach(x => rowPos.forEach(z => peaks.push({ x, z }))); }
              const MARGIN = 0.5;
              const ox = sceneCX - tW / 2;
              const oz = sceneCZ - tD / 2;
              return (wx, wz) => {
                const vx = Math.max(0, Math.min(tW, wx - ox));
                const vz = Math.max(0, Math.min(tD, wz - oz));
                let mD = Infinity;
                for (const p of peaks) { const d = Math.sqrt((vx - p.x) ** 2 + (vz - p.z) ** 2); if (d < mD) mD = d; }
                const dW = Math.min(vx, tW - vx, vz, tD - vz);
                return wallH + (peakH - wallH) * Math.pow(dW / (dW + mD + 0.001), 3.0) - MARGIN;
              };
            };

            const _sceneLightBudget = { remaining: 16 };

            // ── Preload tableware GLBs referenced by place-setting templates ──
            if (STATE.placeSettingTemplates && STATE.placeSettingTemplates.length > 0) {
              STATE.placeSettingTemplates.forEach(function(tpl) {
                if (tpl && tpl.slots) {
                  tpl.slots.forEach(function(slot) {
                    if (slot.itemKey && FURNITURE_GLB_URLS[slot.itemKey]) {
                      ensureFurnitureGlbLoaded(slot.itemKey);
                    }
                  });
                }
              });
            }
            // ── Preload table-body GLBs used by scene items ──
            STATE.items.forEach(function(it) {
              var tKey = getTableGlbKey(it);
              if (tKey) ensureTableGlbLoaded(tKey);
            });

            STATE.items.forEach(item => {
                const def = ITEM_DEFS[item.name]; if(!def) return;
                const iw = item.width || def.width || def.diameter || 1, ih = item.height || def.height || def.diameter || 1;
                const fx = (item.x/CELL_SIZE) - borderCells + ((def.type === 'drape' || def.type === 'stringlights' || def.type === 'stanchions') ? 0 : iw/2), fz = (item.y/CELL_SIZE) - borderCells + ((def.type === 'drape' || def.type === 'stringlights' || def.type === 'stanchions') ? 0 : ih/2);
                const rot = -item.angle * (Math.PI/180);
                if(def.type === 'drape' && item.drapePoints) {
                   const dPoints = item.drapePoints.map(p => {
                     const rad = -(item.angle || 0) * (Math.PI / 180);
                     const rx = (p.x * Math.cos(rad) - p.y * Math.sin(rad)) / CELL_SIZE;
                     const rz = (p.x * Math.sin(rad) + p.y * Math.cos(rad)) / CELL_SIZE;
                     return { x: fx + rx, y: fz + rz };
                   });
                   const dHts = item.drapeHeights || Array(item.drapePoints.length - 1).fill(item.drapeHeight || '8ft');
                   scene.add(createDrapeModule(dPoints, dHts, item.color, item.drapeStyle));
                } else if(def.type === 'stringlights' && item.stringLightPoints) {
                   const lPoints = item.stringLightPoints.map(p => {
                     const rad = -(item.angle || 0) * (Math.PI / 180);
                     const rx = (p.x * Math.cos(rad) - p.y * Math.sin(rad)) / CELL_SIZE;
                     const rz = (p.x * Math.sin(rad) + p.y * Math.cos(rad)) / CELL_SIZE;
                     return { x: fx + rx, y: fz + rz };
                   });
                   const fallbackH = item.stringLightHeightFt || 10;
                   const lHeights = (item.stringLightPointHeightsFt && item.stringLightPointHeightsFt.length === item.stringLightPoints.length)
                     ? item.stringLightPointHeightsFt
                     : new Array(item.stringLightPoints.length).fill(fallbackH);

                   // Build roof clamper for pole tent string lights
                   let _roofClamp = null;
                   const _tlFor = item.tentLightingFor;
                   if (_tlFor === 'main' && STATE.tent && STATE.tent.type === 'Pole') {
                     const _wH = (typeof STATE.tent.poleLegHeightFt === 'number' && isFinite(STATE.tent.poleLegHeightFt)) ? STATE.tent.poleLegHeightFt : 8;
                     const _pH = (typeof STATE.tent.poleCenterPoleHeightFt === 'number' && isFinite(STATE.tent.poleCenterPoleHeightFt)) ? STATE.tent.poleCenterPoleHeightFt : 22;
                     _roofClamp = _buildPoleTentRoofClamper(STATE.tent.width, STATE.tent.height, STATE.tent.width / 2, STATE.tent.height / 2, _wH, _pH);
                   } else if (_tlFor && _tlFor !== 'main') {
                     const _si = STATE.items.find(si => si.id === _tlFor);
                     if (_si) {
                       const _sd = ITEM_DEFS[_si.name];
                       if (_sd && _sd.tentType === 'Pole') {
                         const _sW = _si.width || _sd.width || 1;
                         const _sD = _si.height || _sd.height || 1;
                         const _sCx = (_si.x / CELL_SIZE) - borderCells + _sW / 2;
                         const _sCz = (_si.y / CELL_SIZE) - borderCells + _sD / 2;
                         const _sPH = (typeof _si.poleCenterPoleHeightFt === 'number' && isFinite(_si.poleCenterPoleHeightFt)) ? _si.poleCenterPoleHeightFt : 22;
                         _roofClamp = _buildPoleTentRoofClamper(_sW, _sD, _sCx, _sCz, 8, _sPH);
                       }
                     }
                   }

                   scene.add(createStringLightsModule(
                     lPoints, lHeights,
                     item.stringLightHangFt || 1, item.color || '#ffffff', item.stringLightBulbSpacingFt || 2,
                     !!STATE.isNightMode, item.stringLightsOn !== false,
                     typeof item.stringLightsIntensity === 'number' ? item.stringLightsIntensity : 100,
                     _roofClamp,
                     _sceneLightBudget
                   ));
                } else if(def.type === 'stanchions') {
                   const rawPts = (item.stanchionPoints && item.stanchionPoints.length > 0) ? item.stanchionPoints : [{ x: 0, y: 0 }];
                   const sPoints = rawPts.map(p => {
                     const rad = -(item.angle || 0) * (Math.PI / 180);
                     const rx = (p.x * Math.cos(rad) - p.y * Math.sin(rad)) / CELL_SIZE;
                     const rz = (p.x * Math.sin(rad) + p.y * Math.cos(rad)) / CELL_SIZE;
                     return { x: fx + rx, y: fz + rz };
                   });
                   const finish = item.stanchionFinish || 'chrome';
                   const ropeColor = item.stanchionRopeColor || item.color || def.color || '#991b1b';
                   const sag = (typeof item.stanchionRopeSagFt === 'number') ? item.stanchionRopeSagFt : 0.25;
                   scene.add(createStanchionsModule(sPoints, finish, ropeColor, sag));
                } else if(item.name.includes('modern-lounge')) {
                   const gY = getStgH(fx, fz);
                   const lounge = createModernLounge3D(item.name, iw, ih, item.color);
                   lounge.userData.isFurniture = true;
                   lounge.userData.furnitureKey = item.name;
                   lounge.position.set(fx, gY + (item.elevation || 0), fz);
                   lounge.rotation.y = rot;
                   lounge.traverse(n => { if (n instanceof THREE.Mesh) { n.castShadow = true; n.receiveShadow = true; } });
                   scene.add(lounge);
                } else if(item.name === 'infinity-bar') {
                   const gY = getStgH(fx, fz);
                   ensureFurnitureGlbLoaded('infinity-bar');
                   const bar = new THREE.Group();
                   bar.userData.isFurniture = true;
                   bar.userData.furnitureKey = 'infinity-bar';
                   const proto = furnitureGlbProtoByKey['infinity-bar'];
                   if (proto) {
                     const inst = proto.clone(true);
                     inst.traverse(n => { if (n instanceof THREE.Mesh) { n.castShadow = true; n.receiveShadow = true; } });
                     bar.add(inst);
                   } else {
                     const h3 = FURNITURE_GLB_TARGET_HEIGHT_FT['infinity-bar'] || 4.0;
                     const geo = new THREE.BoxGeometry(iw, h3, ih);
                     const mat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85, metalness: 0.1 });
                     const mesh = new THREE.Mesh(geo, mat);
                     mesh.position.y = h3 / 2;
                     mesh.castShadow = true;
                     mesh.receiveShadow = true;
                     bar.add(mesh);
                   }
                   bar.position.set(fx, gY + (item.elevation || 0), fz);
                   bar.rotation.y = rot;
                   scene.add(bar);
                
                } else if(item.name && !!FURNITURE_GLB_URLS[item.name] && !item.name.includes('modern-lounge') && item.name !== 'infinity-bar' && item.name !== 'dj-light-bar' && item.name !== 'lighting-gobo-projector') {
                   const gY = getStgH(fx, fz);
                   const key = item.name;
                   ensureFurnitureGlbLoaded(key);
                   const grp = new THREE.Group();
                   grp.userData.isFurniture = true;
                   grp.userData.furnitureKey = key;
                   const proto = furnitureGlbProtoByKey[key];
                   if (proto) {
                     const inst = proto.clone(true);
                     inst.traverse(n => {
                       if (n instanceof THREE.Mesh) {
                         n.castShadow = true;
                         n.receiveShadow = true;
                         // Water barrel white variant
                         if (key === 'station-water-barrel-tent' && item.waterBarrelWhite) {
                           var mats = Array.isArray(n.material) ? n.material : [n.material];
                           var newMats = mats.map(function(m) {
                             var c = m.clone();
                             c.color = new THREE.Color(0xf0f0f0);
                             c.map = null;
                             if (c.metalnessMap) c.metalnessMap = null;
                             if (c.roughnessMap) c.roughnessMap = null;
                             if (c.normalMap) c.normalMap = null;
                             if (c.aoMap) c.aoMap = null;
                             if (c.emissiveMap) c.emissiveMap = null;
                             c.roughness = 0.45;
                             c.metalness = 0.05;
                             return c;
                           });
                           n.material = Array.isArray(n.material) ? newMats : newMats[0];
                         }
                       }
                     });
                     grp.add(inst);

                     // Special prop: stage uplight (adds a real THREE.SpotLight + a visible beam cone).
                     if (key === 'truss-stage-light-purple') {
                       try {
                         const c = new THREE.Color(item.color || '#a855f7');

                         const lightEnabled = item.uplightEnabled !== false;
                         const beamEnabled = item.uplightBeamEnabled !== false;

                         const intensity =
                           typeof item.uplightIntensity === 'number' ? item.uplightIntensity : (STATE.isNightMode ? 10 : 7);
                         const distance = typeof item.uplightDistance === 'number' ? item.uplightDistance : 80;
                         const decay = typeof item.uplightDecay === 'number' ? item.uplightDecay : 2;
                         const angle = typeof item.uplightAngle === 'number' ? item.uplightAngle : 0.5;
                         const penumbra = typeof item.uplightPenumbra === 'number' ? item.uplightPenumbra : 0.5;

                         const beamLen = typeof item.uplightBeamLengthFt === 'number' ? item.uplightBeamLengthFt : 10;
                         const beamOpacity = typeof item.uplightBeamOpacity === 'number' ? item.uplightBeamOpacity : 0.25;
                         const beamTaper = typeof item.uplightBeamTaper === 'number' ? item.uplightBeamTaper : 0.02;
                         const beamFalloff = typeof item.uplightBeamFalloff === 'number' ? item.uplightBeamFalloff : 2;
                         const beamBlend = item.uplightBeamBlend === 'normal' ? 'normal' : 'additive';

                         let lensY = 0.85;
                         try {
                           const box = new THREE.Box3().setFromObject(inst);
                           const size = new THREE.Vector3();
                           box.getSize(size);
                           if (size.y && size.y > 1e-6) lensY = box.min.y + size.y * 0.85;
                         } catch (e) {}

                         const safeAngle = Math.min(1.35, Math.max(0.05, angle));
                         const safeLen = Math.min(60, Math.max(0.5, beamLen));
                         const safeOpacity = Math.min(1, Math.max(0, beamOpacity));
                         const safeTaper = Math.min(1, Math.max(0, beamTaper));
                         const safeFalloff = Math.min(10, Math.max(0.1, beamFalloff));
                         const safePenumbra = Math.min(1, Math.max(0, penumbra));

                         if (lightEnabled) {
                           const spot = new THREE.SpotLight(c, intensity, distance, safeAngle, safePenumbra, decay);
                           spot.castShadow = false;
                           spot.position.set(0, Math.max(0.05, lensY), 0);

                           const target = new THREE.Object3D();
                           target.position.set(0, Math.max(0.05, lensY) + safeLen, 0);
                           grp.add(target);
                           spot.target = target;
                           grp.add(spot);
                         }

                         if (beamEnabled && safeLen > 0.01 && safeOpacity > 0.001) {
                           const radiusEnd = Math.tan(safeAngle) * safeLen;
                           const radiusStart = Math.max(0.001, radiusEnd * safeTaper);
                           const beamGeo = new THREE.CylinderGeometry(radiusEnd, radiusStart, safeLen, 24, 12, true);

                           // Fade beam out with distance using vertex colors (avoids the solid white cone).
                           const posAttr = beamGeo.attributes.position;
                           const colors = [];
                           for (let i = 0; i < posAttr.count; i++) {
                             const y = posAttr.getY(i);
                             const t = (y + safeLen / 2) / safeLen;
                             const fade = Math.pow(Math.max(0, 1 - t), safeFalloff);
                             colors.push(c.r * fade, c.g * fade, c.b * fade);
                           }
                           beamGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                           const beamMat = new THREE.MeshBasicMaterial({
                             vertexColors: true,
                             transparent: true,
                             opacity: safeOpacity,
                             side: THREE.DoubleSide,
                             depthWrite: false,
                             blending: beamBlend === 'normal' ? THREE.NormalBlending : THREE.AdditiveBlending,
                           });
                           // Disable tone-mapping for the light beam so the vertex colors remain bright.
                           // (This is a real runtime property on THREE.Material; the TS-only cast was removed.)

        window.onkeyup = e => { if(e.code==='KeyW'||e.code==='ArrowUp') moveRef.f=false; if(e.code==='KeyS'||e.code==='ArrowDown') moveRef.b=false; if(e.code==='KeyA'||e.code==='ArrowLeft') moveRef.l=false; if(e.code==='KeyD'||e.code==='ArrowRight') moveRef.r=false; };
        try { init(); } catch(e) { console.error('TentMapper embed init() failed:', e); document.getElementById('viewport-2d').innerHTML = '<div style="padding:20px;color:red;font-size:12px;font-weight:bold;">Embed failed to initialize: ' + (e.message || e) + '</div>'; }
    </script>
</body>
</html>
